<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Straatos — Mockup 01 bento</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Stage has a fixed aspect ratio; width is the min of available viewport
     width and the width that keeps it within the viewport height. */
  .stage {
    position: relative;
    width: min(100%, calc(100vh * 1660 / 1095));
    aspect-ratio: 1660 / 1095;
  }

  .tile {
    position: absolute;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.45s ease;
    will-change: transform, filter;
  }
  .tile img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
  }
  /* Hover — gentle lift + shadow boost */
  .pc:hover {
    transform: translateY(-8px) scale(1.015);
    filter: drop-shadow(0 24px 48px rgba(15, 23, 42, 0.16));
    z-index: 5;
  }
  .document:hover {
    transform: rotate(-2deg) translateY(-8px) scale(1.025);
    filter: drop-shadow(0 24px 48px rgba(15, 23, 42, 0.20));
    z-index: 5;
  }
  .comments:hover {
    transform: translateY(-8px) scale(1.02);
    filter: drop-shadow(0 24px 48px rgba(15, 23, 42, 0.16));
    z-index: 5;
  }

  /* PC / laptop with New Project drawer — left-centered, dominant */
  .pc {
    left: 4%;
    top: 8%;
    width: 50%;
    z-index: 1;
  }

  /* New Document drawer — top-right, slight tilt */
  .document {
    right: 10%;
    top: 3%;
    width: 24%;
    transform: rotate(-2deg);
    transform-origin: center center;
    z-index: 2;
    filter: drop-shadow(0 12px 32px rgba(15, 23, 42, 0.10));
  }

  /* Comments panel — bottom-right */
  .comments {
    right: 8%;
    bottom: 4%;
    width: 32%;
    z-index: 2;
    filter: drop-shadow(0 12px 28px rgba(15, 23, 42, 0.08));
  }
</style>
</head>
<body>

<div class="stage">
  <div class="tile pc">
    <img src="straatos-bento2/pc.png" alt="Laptop showing the Straatos dashboard greyed behind a New Project drawer with project cover dropzone, project type toggles, country and stage fields">
  </div>
  <div class="tile document">
    <img src="straatos-bento2/document.png" alt="New Document drawer titled SOS Mangrove Records — file uploads list (Validation Evidence Pack.zip, Satellite Boundary Maps.pdf, Field Survey Participants.csv)">
  </div>
  <div class="tile comments">
    <img src="straatos-bento2/comments.png" alt="Comments panel — messages from Mary Brown and John Fontaine, with a typed reply ready to send">
  </div>
</div>

</body>
</html>
