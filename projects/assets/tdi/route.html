<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>TDI · Supply chain route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Frame 1440×665. Tokens do TDI e as curvas de motion lidas do Jitter
   (Smooth = ease-in-out, Slow down = ease-out). */
:root{
  --ground:#0B0C10; --surface:#16171C; --surface2:#1C1E24;
  --line:#2A2B33; --line2:#363843;
  --text:#F1F1F4; --muted:#9A9EAB; --faint:#6C7080; --accent:#7A5AF8;
  --smooth:cubic-bezier(.45,0,.55,1); --slowdown:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:#0A0A0C;min-height:100vh;display:grid;place-items:center;
  font-family:Inter,-apple-system,sans-serif;padding:24px;gap:16px}
.bar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--surface2)}
.fit{flex:none}
.frame{width:1440px;height:665px;background:var(--ground);position:relative;overflow:hidden;
  transform-origin:top left}
svg{display:block;width:100%;height:100%}

.eyebrow{font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;fill:var(--faint)}
.title{font-size:30px;font-weight:600;letter-spacing:-.6px;fill:var(--text)}
.sub{font-size:14px;fill:var(--muted)}
  .c-tier{font-size:9.5px;font-weight:500;fill:var(--faint);letter-spacing:.05em}
.c-title{font-size:12.5px;font-weight:600;fill:var(--text);letter-spacing:-.1px}
.c-key{font-size:11px;fill:var(--muted)}
  .c-val{font-size:11px;font-weight:500;fill:var(--text)}
.c-foot{font-size:9.5px;fill:var(--faint)}
.cap{font-size:11px;fill:var(--faint);letter-spacing:.04em}
.sum-n{font-size:28px;font-weight:600;fill:var(--text);letter-spacing:-.5px}

/* estado inicial: nada existe antes da própria animação (Mode "In" do Jitter) */
#mask-draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
#network{opacity:0}
.node{visibility:hidden}
.card .w{visibility:hidden}
.tip,.pulse{opacity:0}

.play #network{animation:fade 1.1s var(--smooth) forwards}
.play #mask-draw{animation:draw var(--dur) linear .25s forwards}
.play .node{animation:grow .61s var(--slowdown) forwards;animation-delay:var(--t)}
.play .card .w{animation:slideup .346s var(--smooth) forwards;animation-delay:var(--tw)}
.play .tip{animation:tipmove var(--dur) linear .25s forwards,tip var(--dur) linear .25s forwards}
.play .pulse{animation:pulse 4s var(--smooth) infinite;animation-delay:calc(var(--dur) + .4s)}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{visibility:visible;transform:scale(.5)}to{visibility:visible;transform:scale(1)}}
@keyframes slideup{from{visibility:visible;transform:translateY(50%)}to{visibility:visible;transform:translateY(0)}}
@keyframes tipmove{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes tip{0%{opacity:0}5%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.node{transform-box:fill-box;transform-origin:center}
.card .w{transform-box:fill-box}
</style></head>
<body>

<div class="bar"><button id="replay">Replay</button><span>1440 × 665</span></div>
<div class="fit" id="fit"><div class="frame" id="frame">
  <svg id="svg" viewBox="0 0 1440 665" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
</div></div>

<script>
const C = {ground:'#0B0C10', surface:'#16171C', surface2:'#1C1E24', line:'#2A2B33', line2:'#363843',
  text:'#F1F1F4', muted:'#9A9EAB', faint:'#6C7080', accent:'#7A5AF8'};

const ICONS = {
  pickaxe:'<path d="M14.5 12.5 6.6 20.4a1 1 0 1 1-3-3l7.9-7.9"/><path d="M17.7 3.7a1 1 0 0 0-1.4 0l-4.6 4.6a1 1 0 0 0 0 1.4l2.6 2.6a1 1 0 0 0 1.4 0l4.6-4.6a1 1 0 0 0 0-1.4z"/>',
  hand:'<path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  swap:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  flask:'<path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.5a1 1 0 0 0 .9 1.5h12.8a1 1 0 0 0 .9-1.5l-5.1-10.1a2 2 0 0 1-.2-.9V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  layers:'<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
  factory:'<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M17 18h1M12 18h1M7 18h1"/>',
  cell:'<rect x="8" y="4" width="8" height="17" rx="2"/><path d="M10 2h4"/><path d="M10 12h4"/>',
  pack:'<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 11v2M10 11v2M14 11v2"/>',
  car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
};

/* Etapas da cadeia do cobalto, da mina ao veículo.
   Os três campos do card seguem a lógica do OECD: o RISCO é a leitura de um
   segundo; a EVIDÊNCIA diz como aquele dado foi obtido (é o que separa dado
   verificado de dado declarado, a tese do produto); e o terceiro campo é o
   fato que mais importa naquela etapa específica.
   DADOS ILUSTRATIVOS, construídos para a peça. Não são registro auditado. */
const STEPS = [
  {tier:'Mining', icon:'pickaxe', op:'Kamilombe', place:'Kolwezi, DRC',
   risk:'High',   key:'Mine type',    val:'Artisanal',     ev:'Desk research', date:'12 Mar', x:  230, y: 285},
  {tier:'Artisanal Processing', icon:'hand', op:'MIKAS', place:'Kasombo, DRC',
   risk:'Medium', key:'Scheme',       val:'Better Mining', ev:'Third-party audit',    date:'19 Mar', x:  324, y: 322},
  {tier:'Trading', icon:'swap', op:'Glencore', place:'Baar, Switzerland',
   risk:'Low',    key:'Watchlist',    val:'Clear',         ev:'Self-assessment',      date:'21 Apr', x:  439, y: 340},
  {tier:'Smelting', icon:'flame', op:'Tenke Fungurume', place:'Fungurume, DRC',
   risk:'Medium', key:'RMAP',         val:'Conformant',    ev:'Third-party audit',    date:'02 Apr', x:  553, y: 382},
  {tier:'Refining', icon:'flask', op:'GEM', place:'Jingmen, China',
   risk:'Low',    key:'Custody',      val:'Mass balance',  ev:'Third-party audit',    date:'28 May', x:  668, y: 398},
  {tier:'Precursor Manufacturing', icon:'layers', op:'Huayou Cobalt', place:'Quzhou, China',
   risk:'Low',    key:'Recycled',     val:'12%',           ev:'Self-assessment',      date:'14 Jun', x:  782, y: 440},
  {tier:'Cathode Manufacturing', icon:'factory', op:'Umicore', place:'Olen, Belgium',
   risk:'Low',    key:'Recycled',     val:'18%',           ev:'Third-party audit',    date:'09 Jul', x:  897, y: 462},
  {tier:'Battery Cell Manufacturing', icon:'cell', op:'LG Energy Solution', place:'Ochang, South Korea',
   risk:'Low',    key:'Footprint',    val:'58 kg/kWh',     ev:'Self-assessment',      date:'06 Aug', x: 1011, y: 500},
  {tier:'Battery Pack Manufacturing', icon:'pack', op:'LG Energy Solution', place:'Seoul, South Korea',
   risk:'Low',    key:'Passport',     val:'Issued',        ev:'Self-assessment',      date:'21 Aug', x: 1126, y: 510},
  {tier:'OEM', icon:'car', op:'Nikola', place:'Phoenix, USA',
   risk:'Low',    key:'Chain traced', val:'94%',           ev:'Published report',     date:'18 Sep', x: 1210, y: 570},
];
const RISK = {Low:'#4ADE80', Medium:'#FBBF24', High:'#F87171'};

/* Cor por FASE da cadeia, não por etapa: três famílias em vez de dez cores
   avulsas. Upstream é a terra e o minério, midstream é o processo químico,
   downstream é o industrial/elétrico. */
const PHASE = {
  upstream:   {label:'Upstream · extraction',   color:'#F2794C'},
  midstream:  {label:'Midstream · processing',  color:'#73D13D'},
  downstream: {label:'Downstream · manufacture', color:'#69B1FF'},
};
const PHASE_OF = {
  'Mining':'upstream', 'Artisanal Processing':'upstream', 'Trading':'upstream',
  'Smelting':'midstream', 'Refining':'midstream',
  'Precursor Manufacturing':'midstream', 'Cathode Manufacturing':'midstream',
  'Battery Cell Manufacturing':'downstream', 'Battery Pack Manufacturing':'downstream', 'OEM':'downstream',
};
STEPS.forEach(st => { st.phase = PHASE_OF[st.tier]; st.color = PHASE[st.phase].color; });
const N = STEPS.length;
const DUR = 3.2;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const el = (t,a={},i='') => `<${t}${Object.entries(a).map(([k,v])=>v==null?'':` ${k}="${String(v).replace(/"/g,'&quot;')}"`).join('')}>${i}</${t}>`;

/* aleatoriedade com semente, para o mapa ser sempre o mesmo */
let _s = 20260922;
const rnd = () => (_s = (_s * 1664525 + 1013904223) % 4294967296) / 4294967296;
const between = (a, b) => a + rnd() * (b - a);

/* ---------- perspectiva ----------
   O mapa é um plano no chão visto de perto e de baixo: as estradas afinam,
   se adensam e somem no horizonte. Projeção clássica de plano: um ponto no
   plano (x lateral, z profundidade) vira X = CX + F·x/z, Y = HZ + F/z.
   z → ∞ converge para a linha do horizonte. */
const HZ = 156, F = 520, CX = 720;
const proj = (x, z) => ({x: CX + F*x/z, y: HZ + F/z});
const zAtY = y => F / (y - HZ);              // inverso, para escolher profundidades
const xAtX = (X, z) => (X - CX) * z / F;

/* ---------- a malha de estradas ----------
   Pontos distribuídos no plano de modo que fiquem uniformes NA TELA (o passo
   em z cresce com a profundidade), ligados a vizinhos de forma irregular.
   Cada ligação é desenhada como polilinha torta, por deslocamento do ponto
   médio — é o que faz a linha parecer estrada e não aresta de grafo. */
function wiggle(p0, p1, depth, amp){
  if (depth === 0) return [p0, p1];
  const mx = (p0.x + p1.x) / 2, mz = (p0.z + p1.z) / 2;
  const dx = p1.x - p0.x, dz = p1.z - p0.z, len = Math.hypot(dx, dz);
  const nx = -dz / len, nz = dx / len;
  const off = between(-amp, amp) * len;
  const m = {x: mx + nx*off, z: mz + nz*off};
  return [...wiggle(p0, m, depth-1, amp*.6).slice(0, -1), ...wiggle(m, p1, depth-1, amp*.6)];
}
function network(){
  /* Grade uniforme no MUNDO, não na tela: é o que faz as células ficarem
     largas na frente e virarem textura fina perto do horizonte, como numa
     foto de estrada. Pontos fora do quadro são descartados. */
  /* o passo em z cresce em progressão geométrica: fileiras próximas ficam
     juntas o bastante para povoar o primeiro plano, e as distantes se
     acumulam perto do horizonte. O passo lateral cresce menos que z, então
     o fundo também adensa na horizontal. */
  const rows = [];
  for (let z = 0.92; z <= 16; z *= 1.17){
    const half = 1.95 * z, dx = 0.30 + 0.055 * z, cols = [];
    for (let x = -half; x <= half; x += dx){
      cols.push({x: x + between(-.3, .3) * dx, z: z * (1 + between(-.06, .06))});
    }
    rows.push(cols.sort((p, q) => p.x - q.x));
  }
  const roads = [];
  rows.forEach((row, r) => {
    const up = rows[r+1];
    row.forEach((p, c) => {
      if (row[c+1] && rnd() < .78) roads.push([p, row[c+1]]);
      if (!up) return;
      /* liga aos mais próximos da fileira de trás, por proximidade lateral */
      const near = up.map(q => ({q, d: Math.abs(q.x - p.x)})).sort((u, v) => u.d - v.d).slice(0, 3);
      near.forEach((o, k) => { if (rnd() < [.74, .36, .15][k]) roads.push([p, o.q]); });
    });
  });
  return roads.map(([p0, p1]) => ({
    pts: wiggle(p0, p1, 3, .1),
    z: (p0.z + p1.z) / 2,
    major: rnd() < .12,
    bright: 0.42 + rnd() * 0.8,        // variação de brilho, para a malha não ficar chapada
  }));
}
const ROADS = network();

/* ---------- a estrada destacada ----------
   As etapas são postas pelo lugar que devem ocupar na tela; daí volto para as
   coordenadas do plano, porque é lá que a estrada ganha as curvas. A rota
   desce da esquerda para a direita, ou seja, vem de longe e chega perto. */
STEPS.forEach(st => {
  st.z = zAtY(st.y);
  st.px = xAtX(st.x, st.z);
});

function road(steps){
  const head = {z: steps[0].z * 1.22};  head.x = xAtX(steps[0].x - 230, head.z);
  const tail = {z: steps[N-1].z * .84}; tail.x = xAtX(steps[N-1].x + 230, tail.z);
  const ctrl = [head];
  steps.forEach((st, i) => {
    ctrl.push({x: st.px, z: st.z});
    const nx = steps[i+1];
    if (!nx) return;
    const dx = nx.px - st.px, dz = nx.z - st.z, len = Math.hypot(dx, dz);
    const px = -dz / len, pz = dx / len;
    [0.36, 0.70].forEach(f => {
      const off = between(-.13, .13) * len;
      ctrl.push({x: st.px + dx*f + px*off, z: st.z + dz*f + pz*off});
    });
  });
  ctrl.push(tail);
  return ctrl.map(p => proj(p.x, p.z));
}
function catmull(pts, tension = 1){
  const P = [pts[0], ...pts, pts[pts.length-1]];
  let d = `M${P[1].x.toFixed(1)},${P[1].y.toFixed(1)}`;
  for (let i = 1; i < P.length - 2; i++){
    const p0=P[i-1], p1=P[i], p2=P[i+1], p3=P[i+2];
    const c1 = {x: p1.x + (p2.x-p0.x)/6*tension, y: p1.y + (p2.y-p0.y)/6*tension};
    const c2 = {x: p2.x - (p3.x-p1.x)/6*tension, y: p2.y - (p3.y-p1.y)/6*tension};
    d += ` C${c1.x.toFixed(1)},${c1.y.toFixed(1)} ${c2.x.toFixed(1)},${c2.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
const D = catmull(road(STEPS), 0.9);

/* ---------- render ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');

/* mede o caminho para saber quando a ponta chega em cada etapa */
const probe = document.createElementNS(NS, 'path');
probe.setAttribute('d', D);
svg.appendChild(probe);
const L = probe.getTotalLength();
const pts = [];
for (let s = 0; s <= L; s += 3){ const q = probe.getPointAtLength(s); pts.push({s, x:q.x, y:q.y}); }
const sAt = STEPS.map(st => {
  let best = 0, bd = Infinity;
  pts.forEach(q => { const d = (q.x-st.x)**2 + (q.y-st.y)**2; if (d < bd){ bd = d; best = q.s; } });
  return best;
});
const probeAt = s => { let b = pts[0]; pts.forEach(q => { if (Math.abs(q.s-s) < Math.abs(b.s-s)) b = q; }); return b; };
const sub = (s0, s1) => 'M' + pts.filter(q => q.s >= s0-.01 && q.s <= s1+.01)
  .map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' L');
svg.removeChild(probe);

let out = '';
out += el('rect', {id:'bg', width:1440, height:665, fill:C.ground});

/* malha de estradas, em perspectiva */
let netEdges = '';
ROADS.forEach(rd => {
  const d = 'M' + rd.pts.map(p => { const q = proj(p.x, p.z); return `${q.x.toFixed(1)},${q.y.toFixed(1)}`; }).join(' L');
  const scale = F / rd.z;                                  // quanto mais perto, mais grosso
  const w = Math.max(.35, Math.min(3.4, scale * (rd.major ? .0085 : .0048)));
  const op = Math.max(.08, Math.min(.8, (rd.major ? .78 : .42) * rd.bright * (0.34 + 0.66 / (1 + rd.z * 0.07))));
  netEdges += el('path', {d, stroke: rd.major ? '#A9BBD6' : '#8496B2', 'stroke-width':w.toFixed(2),
    'stroke-opacity':op.toFixed(3), fill:'none', 'stroke-linecap':'round', 'stroke-linejoin':'round'});
});
out += el('g', {id:'network'}, netEdges) +
  el('rect', {id:'haze', x:0, y:HZ-6, width:1440, height:126, fill:'url(#haze)'});

out += el('g', {id:'header'},
  el('text', {x:64, y:74, class:'eyebrow'}, 'Supply chain route') +
  el('text', {x:64, y:114, class:'title'}, 'From mine site to battery pack') +
  el('text', {x:64, y:142, class:'sub'}, 'Every stage of the cobalt chain, in the order the material moves through it.'));
out += el('g', {id:'summary'},
  el('text', {x:1376, y:104, class:'sum-n', 'text-anchor':'end'}, String(N)) +
  el('text', {x:1376, y:128, class:'cap', 'text-anchor':'end'}, 'stages, mine site to battery pack'));

/* a estrada destacada: linha clara e fina, revelada por uma máscara que a
   percorre. A cor vive nos marcadores, como no mapa que a Pietra montou. */
out += el('g', {id:'road', mask:'url(#reveal)'},
  el('path', {d:D, stroke:'#FFFFFF', 'stroke-width':9, fill:'none', 'stroke-linecap':'round',
    'stroke-opacity':.10, filter:'url(#soft)'}) +
  el('path', {d:D, stroke:'#F4F7FC', 'stroke-width':2.1, fill:'none', 'stroke-linecap':'round',
    'stroke-opacity':.96}));

out += el('circle', {class:'tip', id:'tip', r:4.5, fill:'#fff', style:`offset-path:path('${D}')`});
out += el('circle', {class:'pulse', id:'pulse', r:4, fill:'#fff', 'fill-opacity':.85,
  style:`offset-path:path('${D}');--dur:${DUR}s`});

/* etapas: marcador redondo com anel na cor do tier, e um card com os dados
   do lote. O card alterna entre acima-à-direita e abaixo-à-esquerda, que é a
   perpendicular ao sentido da rota — assim nunca cobre a linha nem o marcador
   vizinho. */
let nodes = '', cards = '';
const R = 13, CW = 186, PAD = 12;
STEPS.forEach((st, i) => {
  const t = sAt[i] / L * DUR + 0.25;

  nodes += el('g', {class:'node', id:`node/${st.tier}`, style:`--t:${t.toFixed(3)}s`},
    el('circle', {cx:st.x, cy:st.y, r:R + 7, fill:C.ground, 'fill-opacity':.82}) +
    el('circle', {cx:st.x, cy:st.y, r:R, fill:C.surface}) +
    el('circle', {cx:st.x, cy:st.y, r:R, fill:st.color, 'fill-opacity':.15}) +
    el('circle', {cx:st.x, cy:st.y, r:R, stroke:st.color, 'stroke-width':1.6}) +
    el('g', {transform:`translate(${st.x-7},${st.y-7}) scale(.583)`, fill:'none', stroke:st.color,
      'stroke-width':2.3, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, ICONS[st.icon]));

  const rows = [['Risk', st.risk, RISK[st.risk]], [st.key, st.val], ['Evidence', st.ev]];
  const CH = 26 + 22 + rows.length * 18 + 22;
  const upRight = i % 2 === 1;
  const cx = upRight ? st.x + 20 : st.x - 20 - CW;
  const cy = upRight ? st.y - 20 - CH : st.y + 20;

  cards += el('g', {class:'card', id:`card/${st.tier}`, style:`--tw:${(t + 0.1).toFixed(3)}s`},
    el('g', {class:'w'},
      el('rect', {x:cx, y:cy, width:CW, height:CH, rx:9, fill:C.surface, 'fill-opacity':.95}) +
      el('rect', {x:cx, y:cy, width:CW, height:CH, rx:9, stroke:'#FFFFFF', 'stroke-opacity':.09}) +
      el('text', {x:cx+PAD, y:cy+19, class:'c-tier'}, esc(st.tier)) +
      el('text', {x:cx+PAD, y:cy+37, class:'c-title'}, esc(st.op)) +
      rows.map(([k, v, dot], r) => {
        const y = cy + 59 + r*18;
        return el('text', {x:cx+PAD, y, class:'c-key'}, esc(k)) +
               (dot ? el('circle', {cx:cx+CW-PAD-v.length*6.1-9, cy:y-3.5, r:3, fill:dot}) : '') +
               el('text', {x:cx+CW-PAD, y, class:'c-val', fill:dot || null, 'text-anchor':'end'}, esc(v));
      }).join('') +
      el('line', {x1:cx+PAD, y1:cy+CH-26, x2:cx+CW-PAD, y2:cy+CH-26, stroke:'#FFFFFF', 'stroke-opacity':.07}) +
      el('text', {x:cx+PAD, y:cy+CH-11, class:'c-foot'}, 'Updated ' + esc(st.date))));
});
out += el('g', {id:'cards'}, cards) + el('g', {id:'nodes'}, nodes);

out += el('defs', {},
  el('linearGradient', {id:'haze', x1:0, y1:HZ-6, x2:0, y2:HZ+120, gradientUnits:'userSpaceOnUse'},
    el('stop', {offset:'0', 'stop-color':C.ground, 'stop-opacity':'.96'}) +
    el('stop', {offset:'.5', 'stop-color':C.ground, 'stop-opacity':'.42'}) +
    el('stop', {offset:'1', 'stop-color':C.ground, 'stop-opacity':'0'})) +
  el('filter', {id:'soft', x:'-25%', y:'-25%', width:'150%', height:'150%'},
    el('feGaussianBlur', {stdDeviation:5})) +
  el('mask', {id:'reveal'},
    el('path', {id:'mask-draw', d:D, stroke:'#fff', 'stroke-width':34, fill:'none', 'stroke-linecap':'round'})));

svg.innerHTML = out;

/* ---------- controles ---------- */
const frame = document.getElementById('frame');
frame.style.setProperty('--len', L.toFixed(1));
frame.style.setProperty('--dur', DUR + 's');

function play(){ frame.classList.remove('play'); void frame.offsetWidth; frame.classList.add('play'); }
document.getElementById('replay').onclick = play;

window.seek = t => {
  play();
  frame.querySelectorAll('*').forEach(e => {
    const cs = getComputedStyle(e);
    if (cs.animationName === 'none') return;
    if (!e.dataset.d) e.dataset.d = parseFloat(cs.animationDelay) || 0;
    e.style.animationDelay = (parseFloat(e.dataset.d) - t) + 's';
    e.style.animationPlayState = 'paused';
  });
  return 'seek ' + t + 's';
};
window.resume = () => { frame.querySelectorAll('*').forEach(e => {
  e.style.animationDelay = ''; e.style.animationPlayState = ''; }); play(); };

/* exportSVG(): devolve o frame como SVG estático e autossuficiente —
   estilos de texto viram atributos, a máscara sai e tudo fica visível. */
window.exportSVG = () => {
  const c = svg.cloneNode(true);
  const FONT = {
    eyebrow:{s:11.5, w:500, f:C.faint, ls:'.08em'}, title:{s:30, w:600, f:C.text, ls:'-.6px'},
    sub:{s:14, w:400, f:C.muted},
    'c-tier':{s:9.5, w:500, f:C.faint, ls:'.05em'},
    'c-title':{s:12.5, w:600, f:C.text, ls:'-.1px'}, 'c-key':{s:11, w:400, f:C.muted},
    'c-val':{s:11, w:500, f:C.text}, 'c-foot':{s:9.5, w:400, f:C.faint},
    cap:{s:11, w:400, f:C.faint, ls:'.04em'}, 'sum-n':{s:28, w:600, f:C.text, ls:'-.5px'},
  };
  c.querySelectorAll('text').forEach(t => {
    const cl = t.getAttribute('class'); const k = FONT[cl]; if (!k) return;
    if (cl === 'eyebrow') t.textContent = t.textContent.toUpperCase();
    t.removeAttribute('class');
    t.setAttribute('font-family', 'Inter, sans-serif');
    t.setAttribute('font-size', k.s); t.setAttribute('font-weight', k.w);
    if (!t.getAttribute('fill')) t.setAttribute('fill', k.f);
    if (k.ls) t.setAttribute('letter-spacing', k.ls);
  });
  c.querySelectorAll('[class]').forEach(e => {
    const cl = e.getAttribute('class');
    if (cl === 'tip' || cl === 'pulse') { e.remove(); return; }   // só existem na animação
    e.removeAttribute('class');
  });
  const road = c.querySelector('#road'); if (road) road.removeAttribute('mask');
  const mask = c.querySelector('#reveal'); if (mask) mask.remove();
  c.querySelector('#network').removeAttribute('opacity');
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  c.setAttribute('width', 1440); c.setAttribute('height', 665);
  return new XMLSerializer().serializeToString(c);
};

/* só para revisão: encaixa o frame na janela, sem alterar o desenho */
const fitBox = document.getElementById('fit');
function fit(){
  const k = Math.min(1, (innerWidth - 60) / 1440, (innerHeight - 130) / 665);
  frame.style.transform = `scale(${k})`;
  fitBox.style.width = (1440*k) + 'px'; fitBox.style.height = (665*k) + 'px';
}
addEventListener('resize', fit); fit();

play();
</script>
</body></html>
