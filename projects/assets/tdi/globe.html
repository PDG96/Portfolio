<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply chain globe · LGES cobalt route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<style>
  :root{
    --bg:#1B1B20; --panel:#121316; --panel-2:#17181c; --border:#25272d; --border-2:#2f323a;
    --text:#f0f1f2; --text-2:#c9cbcf; --muted:#8a8e96; --muted-2:#5f636b;
    --accent:#8b5cf6; --accent-2:#a78bfa;
    --low:#4ade80; --medium:#fbbf24; --high:#f87171; --unverified:#6b7280;
    --globe:#0d1b2e; --land:#14294a; --land-line:#2b4a7a; --sea-line:#1a2d4c;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --fly:1.3s; --ease:cubic-bezier(.65,0,.35,1); /* ease-in-out cubic, same curve as the globe.gl camera tween */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
  .frame{position:relative;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#22232b 0%,var(--bg) 60%)}
  #globe{position:absolute;inset:0}
  #globe canvas{outline:none}

  /* Markers on the globe */
  .marker{position:relative;width:12px;height:12px;will-change:transform;transform:translate(-50%,-50%);cursor:pointer;pointer-events:auto}
  .marker i{position:absolute;inset:3px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(27,27,32,.95),0 0 10px 1px var(--glow,transparent)}
  .marker::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--c);opacity:.4;transition:opacity .25s ease,transform .25s ease}
  .marker.focus::before{border-color:var(--accent-2);opacity:.9;transform:scale(1.35)}
  .marker.dim{opacity:.35}
  .mlabel{position:absolute;left:14px;top:50%;transform:translateY(-50%);white-space:nowrap;
    font-size:11px;font-weight:500;color:var(--text-2);line-height:1.15;
    background:rgba(30,30,36,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:4px 8px 4px 7px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none}
  .mlabel small{display:block;font-size:9.5px;font-weight:400;color:var(--muted);margin-top:1px}
  .frame.close .mlabel{opacity:1}
  .marker.pinned.dim{opacity:1}
  /* Glass card anchored to the LGES pin. Two layers: a compact pill and the
     full card laid out at its final size. Opening only animates transform and
     opacity (compositor work), so the card and the camera fly stay smooth;
     animating font-size/width/height meant a full relayout every frame. */
  .gcard{position:absolute;left:0;top:50%;width:0;height:0;pointer-events:none}
  .glass{background:rgba(30,30,36,.58);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);color:var(--text)}
  .gc-mini{position:absolute;left:18px;top:0;transform:translateY(-50%);font-size:13px;width:max-content;padding:.75em 1.15em .75em .75em;border-radius:1.2em;
    pointer-events:auto;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:.9em;
    transition:opacity .35s var(--ease);will-change:opacity}
  .gc-mini .logo{width:2.5em;height:2.5em}
  .gc-mini .name{font-size:1.15em}
  .gc-full{position:absolute;left:-6px;bottom:16px;font-size:19px;width:30.5em;padding:1.3em 1.45em;border-radius:1.2em;
    pointer-events:auto;cursor:default;white-space:nowrap;
    transform-origin:0 100%;transform:scale(.35);opacity:0;
    transition:transform var(--fly) var(--ease),opacity .55s var(--ease);will-change:transform,opacity}
  .gcard.open .gc-mini{opacity:0;pointer-events:none;transition-duration:.25s}
  .gcard.open .gc-full{transform:scale(1);opacity:1}
  .gcard .head{display:flex;align-items:center;gap:.9em}
  .gcard .logo{width:3.3em;height:3.3em;border-radius:50%;flex:none;display:block}
  .gcard .name{font-size:1.25em;font-weight:600;line-height:1.2}
  .gcard .city{font-size:.92em;color:var(--muted);margin-top:.15em}
  .gcard .chain{margin-left:auto;font:inherit;font-size:1em;font-weight:500;color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:.6em;padding:.6em 1.05em;cursor:pointer;transition:background .15s,transform .1s}
  .gcard .chain:hover{background:rgba(255,255,255,.14)}
  .gcard .chain:active,.gcard .chain.pressed{background:rgba(255,255,255,.2);transform:scale(.97)}
  .gcard .body{display:grid;grid-template-columns:1fr 1fr;gap:1.35em 1.05em;margin-top:1.45em}
  .gcard .body label{display:block;font-size:.87em;color:var(--muted);margin-bottom:.55em}
  .gcard .body .val{font-size:1em;display:flex;align-items:center;gap:.55em;white-space:normal;line-height:1.25}
  .gcard .ico{width:2.15em;height:2.15em;border-radius:.5em;flex:none;display:grid;place-items:center;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.22);color:var(--low)}
  .gcard .ico svg{width:1.15em;height:1.15em}
  .gcard .pill{display:inline-flex;align-items:center;gap:.45em;padding:.4em .85em;border-radius:999px;font-size:.93em;font-weight:500;color:var(--low);background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.22)}
  .gcard .pill i{width:.45em;height:.45em;border-radius:50%;background:var(--low)}
  .gcard .flags{font-size:1.33em;line-height:1;letter-spacing:1px}
  .gcard .body .wide{grid-column:1 / -1}
  .gcard .divider{grid-column:1 / -1;height:1px;background:rgba(255,255,255,.08);margin:.15em 0}
  .gcard .chips{display:flex;flex-wrap:wrap;gap:.45em}
  .gcard .chip{display:inline-flex;align-items:center;gap:.45em;padding:.33em .7em;border-radius:.55em;font-size:.87em;color:var(--text-2);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);white-space:nowrap}
  .gcard .chip b{font-weight:500;color:var(--text)}
  .gcard .chip small{color:var(--muted);font-size:.9em}
  .gcard .kv{display:flex;align-items:baseline;gap:.45em}
  .gcard .kv b{font-size:1.35em;font-weight:600;line-height:1}
  .gcard .kv span{font-size:.87em;color:var(--muted)}
  .gcard .foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;font-size:.85em;color:var(--muted);padding-top:.15em}
  .gcard .foot i{width:.4em;height:.4em;border-radius:50%;background:var(--accent-2);display:inline-block;margin-right:.5em;vertical-align:middle}
  .marker.selected::before{border-color:#fff;opacity:1;transform:scale(1.7)}
  .marker.selected i{background:#fff}

  .tip{position:absolute;z-index:5;pointer-events:none;background:rgba(18,19,22,.96);border:1px solid var(--border-2);border-radius:8px;padding:8px 10px;min-width:180px;transform:translate(14px,-50%);opacity:0;transition:opacity .12s}
  .tip.on{opacity:1}
  .tip .t-tier{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .tip .t-name{font-size:13px;font-weight:600}
  .tip .t-meta{font-size:11px;color:var(--muted);margin-top:2px}

</style>
</head>
<body>
<div class="frame">
  <div id="globe"></div>

  <div class="tip" id="tip"></div>

</div>

<script>
/* ------------------------------------------------------------------
   DATA
   Participants mirror the LGES flow map (10 tiers, OEM down to mine).
   Names come from the prototype; each one sits at the real operating
   site of that kind of facility, so the geography reads true:
   cobalt out of the DRC Copperbelt (Kolwezi, Lubumbashi, Fungurume),
   traders in Switzerland and Tokyo, refining and precursor work in
   China, Finland, Belgium and Canada, cells and packs in Korea and
   China, the OEM in the US.
------------------------------------------------------------------ */
const TIERS = [
  'OEM','Battery Pack Manufacturing','Battery Cell Manufacturing','Cathode Manufacturing',
  'Precursor Manufacturing','Refining','Trading','Smelting','Artisanal Processing','Mining'
];

const NODES = [

  {id:'huayou-cathode', name:'Huayou Cobalt', full:'Zhejiang Huayou Cobalt', tier:3, city:'Tongxiang, China', cc:'CN', lat:30.63, lng:120.56, risk:'low'},
  {id:'lf', name:'L&F', full:'L&F Co.', tier:3, city:'Daegu, South Korea', cc:'KR', lat:35.87, lng:128.60, risk:'low'},

  {id:'jinchuan', name:'Jinchuan Group Ltd', full:'Jinchuan Group', tier:4, city:'Jinchang, China', cc:'CN', lat:38.52, lng:102.19, risk:'low'},

  {id:'gem-precursor', name:'GEM', full:'Green Eco-manufacture', tier:4, city:'Jingmen, China', cc:'CN', lat:31.03, lng:112.20, risk:'low'},
  {id:'huayou-precursor', name:'Huayou Cobalt', full:'Zhejiang Huayou Cobalt', tier:4, city:'Quzhou, China', cc:'CN', lat:28.97, lng:118.87, risk:'low'},
  {id:'umicore-precursor', name:'Umicore S.A', full:'Umicore', tier:4, city:'Kokkola, Finland', cc:'FI', lat:63.84, lng:23.13, risk:'low'},
  // Refining
  {id:'ningbo-congo', name:'Ningbo Congo', full:'Ningbo Congo Mining', tier:5, city:'Lubumbashi, DRC', cc:'CD', lat:-11.72, lng:27.38, risk:'low'},

  {id:'unk-luoyang', name:'Unverified refiner', full:'Participant pending verification', tier:5, city:'Luoyang, China', cc:'CN', lat:34.62, lng:112.45, risk:'unverified'},

  {id:'electra', name:'Electra Battery Materials Corp', full:'Electra Battery Materials', tier:5, city:'Temiskaming Shores, Canada', cc:'CA', lat:47.50, lng:-79.68, risk:'low'},

  {id:'ixm', name:'IXM S.A.', full:'IXM', tier:6, city:'Geneva, Switzerland', cc:'CH', lat:46.20, lng:6.14, risk:'low'},

  {id:'telf', name:'Telf A.G.', full:'Telf', tier:6, city:'Lugano, Switzerland', cc:'CH', lat:46.00, lng:8.95, risk:'low', focus:true},
  // Smelting
  {id:'tfm', name:'TFM', full:'Tenke Fungurume Mining', tier:7, city:'Fungurume, DRC', cc:'CD', lat:-10.62, lng:26.31, risk:'medium'},
  {id:'mmg-smelt', name:'MMG', full:'MMG Kinsevere', tier:7, city:'Kinsevere, DRC', cc:'CD', lat:-11.35, lng:27.55, risk:'low', focus:true},
  {id:'ruashi-smelt', name:'Ruashi Mining', full:'Ruashi Mining', tier:7, city:'Ruashi, DRC', cc:'CD', lat:-11.62, lng:27.66, risk:'low', focus:true},
  {id:'cdm-smelt', name:'CDM', full:'Congo Dongfang Mining', tier:7, city:'Lubumbashi, DRC', cc:'CD', lat:-11.8, lng:27.52, risk:'low'},
  {id:'kcc', name:'KCC', full:'Kamoto Copper Company', tier:7, city:'Kolwezi, DRC', cc:'CD', lat:-10.72, lng:25.47, risk:'low'},
  {id:'mumi', name:'MUMI Mutanda Mining', full:'Mutanda Mining', tier:7, city:'Mutanda, DRC', cc:'CD', lat:-10.8, lng:25.85, risk:'low'},
  {id:'tengyuan', name:'Tengyuan Cobalt Co.', full:'Tengyuan Cobalt', tier:7, city:'Lubumbashi, DRC', cc:'CD', lat:-11.55, lng:27.3, risk:'low'},
  {id:'mikas-smelt', name:'MIKAS', full:'Minière de Kasombo', tier:7, city:'Kasombo, DRC', cc:'CD', lat:-10.95, lng:25.3, risk:'low', focus:true},
  // Artisanal processing
  {id:'mikas-ap', name:'MIKAS', full:'Minière de Kasombo', tier:8, city:'Kasombo, DRC', cc:'CD', lat:-11.05, lng:25.22, risk:'medium', focus:true},
  {id:'tcc', name:'TCC', full:'Tengyuan Cobalt & Copper Resources', tier:8, city:'Kolwezi, DRC', cc:'CD', lat:-10.68, lng:25.75, risk:'medium'},
  // Mining
  {id:'kimin', name:'KIMIN SAS', full:'Kisanfu Mining SAS', tier:9, city:'Kisanfu, DRC', cc:'CD', lat:-10.72, lng:26.05, risk:'low'},
  {id:'mmg-mine', name:'MMG', full:'MMG Kinsevere mine', tier:9, city:'Kinsevere, DRC', cc:'CD', lat:-11.25, lng:27.68, risk:'low', focus:true},
  {id:'ruashi-mine', name:'Ruashi Mining', full:'Ruashi open pit', tier:9, city:'Ruashi, DRC', cc:'CD', lat:-11.52, lng:27.72, risk:'low'},
  {id:'mikas-mine', name:'MIKAS', full:'Minière de Kasombo', tier:9, city:'Kasombo, DRC', cc:'CD', lat:-10.98, lng:25.1, risk:'low'},
  {id:'mopani', name:'Mopani Copper Mines plc', full:'Mopani Copper Mines', tier:9, city:'Mufulira, Zambia', cc:'ZM', lat:-12.55, lng:28.24, risk:'low'},
  {id:'sicomines', name:'Sicomines', full:'Sino-Congolaise des Mines', tier:9, city:'Kolwezi, DRC', cc:'CD', lat:-10.6, lng:25.62, risk:'medium', focus:true},
  {id:'cdm-mine', name:'CDM', full:'Congo Dongfang Mining', tier:9, city:'Kolwezi, DRC', cc:'CD', lat:-10.78, lng:25.62, risk:'low'},
  {id:'kamilombe', name:'Kamilombe', full:'Kamilombe artisanal site', tier:9, city:'Kolwezi, DRC', cc:'CD', lat:-10.88, lng:25.42, risk:'high'},
  {id:'unk-kolwezi', name:'Unverified mine site', full:'Participant pending verification', tier:9, city:'Kolwezi, DRC', cc:'CD', lat:-10.55, lng:25.45, risk:'unverified'},
];

// Downstream → upstream, read from the flow map. `f` marks the LGES traced route.
const EDGES = [
  ['nikola','catl-pack'], ['nikola','lges-pack','f'],
  ['catl-pack','catl-cell'], ['lges-pack','lges-cell','f'],
  ['catl-cell','huayou-cathode'], ['catl-cell','lf'], ['catl-cell','posco'], ['catl-cell','umicore-cathode'], ['catl-cell','xiamen'],
  ['lges-cell','lf'], ['lges-cell','posco'], ['lges-cell','lges-cathode','f'], ['lges-cell','nichia'], ['lges-cell','ultium'],
  ['huayou-cathode','jinchuan'], ['huayou-cathode','huayou-precursor'], ['lf','jinchuan'], ['posco','minmetals'],
  ['umicore-cathode','gem-precursor'], ['umicore-cathode','umicore-precursor'],
  ['lges-cathode','minmetals','f'], ['lges-cathode','gem-precursor','f'], ['lges-cathode','huayou-precursor'],
  ['nichia','huayou-precursor'], ['ultium','umicore-precursor'], ['xiamen','umicore-precursor'],
  ['jinchuan','ningbo-congo'], ['jinchuan','vale'], ['minmetals','unk-luoyang'], ['minmetals','gem-refining','f'],
  ['gem-precursor','gem-refining','f'], ['huayou-precursor','huayou-refining'], ['huayou-precursor','gem-refining'],
  ['umicore-precursor','umicore-refining'], ['umicore-precursor','electra'],
  ['ningbo-congo','ixm'], ['vale','ixm'], ['unk-luoyang','marubeni'], ['gem-refining','marubeni','f'], ['gem-refining','glencore'],
  ['huayou-refining','huayou-trading'], ['umicore-refining','glencore'], ['umicore-refining','telf','f'], ['electra','telf'],
  ['ixm','tfm'], ['ixm','mmg-smelt'], ['ixm','ruashi-smelt'],
  ['marubeni','mmg-smelt','f'], ['marubeni','ruashi-smelt','f'], ['marubeni','cdm-smelt'],
  ['glencore','kcc'], ['glencore','mumi'], ['huayou-trading','cdm-smelt'], ['huayou-trading','tengyuan'],
  ['telf','mumi'], ['telf','mikas-smelt','f'],
  ['mmg-smelt','mikas-ap','f'], ['ruashi-smelt','mikas-ap','f'], ['cdm-smelt','mikas-ap'], ['tengyuan','tcc'], ['mikas-smelt','tcc'], ['kcc','tcc'],
  ['tfm','kimin'], ['mmg-smelt','mmg-mine','f'], ['ruashi-smelt','ruashi-mine'], ['mumi','kimin'], ['kcc','cdm-mine'], ['mikas-smelt','sicomines','f'],
  ['mikas-ap','ruashi-mine'], ['mikas-ap','mikas-mine'], ['mikas-ap','mopani','f'],
  ['tcc','sicomines'], ['tcc','cdm-mine'], ['tcc','kamilombe'], ['tcc','unk-kolwezi'],
];

const FLAG = cc => cc.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
const RISK_LABEL = {low:'Low', medium:'Medium', high:'High', unverified:'Unverified'};
const RISK_COLOR = {low:'#4ade80', medium:'#fbbf24', high:'#f87171', unverified:'#6b7280'};

/* Os pontos passam a carregar a FASE da cadeia, não o risco: três famílias
   em vez de um semáforo. O risco continua escrito no tooltip e no card, em
   palavra e na cor da pill, então não se perde a leitura. */
const PHASE = {
  upstream:   {label:'Upstream · extraction',    color:'#F2794C'},
  midstream:  {label:'Midstream · processing',   color:'#73D13D'},
  downstream: {label:'Downstream · manufacture', color:'#69B1FF'},
};
/* TIERS vai do OEM (0) à mina (9); as fases seguem essa ordem invertida. */
const PHASE_OF_TIER = [
  'downstream','downstream','downstream',   // OEM, Battery Pack, Battery Cell
  'midstream','midstream','midstream',      // Cathode, Precursor, Refining
  'upstream',                               // Trading
  'midstream',                              // Smelting
  'upstream','upstream',                    // Artisanal Processing, Mining
];
const phaseOf = d => PHASE_OF_TIER[d.tier];
const PHASE_COLOR = d => PHASE[phaseOf(d)].color;
const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

// Purple is reserved for the links that touch the LGES pack plant itself.
const HERO = 'lges-pack';
const arcs = EDGES.map(([a, b]) => {
  const A = byId[a], B = byId[b];
  return {from:a, to:b, focus:a === HERO || b === HERO, startLat:A.lat, startLng:A.lng, endLat:B.lat, endLng:B.lng};
});
const heroLinked = new Set([HERO, ...EDGES.filter(e => e.includes(HERO)).flatMap(e => [e[0], e[1]])]);

/* ------------------------------------------------------------------
   GLOBE
------------------------------------------------------------------ */
const el = document.getElementById('globe');

// A light star field, drawn once. Kept sparse so the chain stays the subject.
(function stars(){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1000;
  const g = c.getContext('2d');
  for (let i = 0; i < 260; i++){
    const r = Math.random() < 0.85 ? 0.7 : 1.3;
    g.globalAlpha = 0.18 + Math.random() * 0.5;
    g.fillStyle = Math.random() < 0.2 ? '#c7d2fe' : '#ffffff';
    g.beginPath(); g.arc(Math.random() * c.width, Math.random() * c.height, r, 0, Math.PI * 2); g.fill();
  }
  const frame = document.querySelector('.frame');
  frame.style.backgroundImage = `url(${c.toDataURL()}), radial-gradient(ellipse at 50% 40%, #22232b 0%, var(--bg) 60%)`;
  frame.style.backgroundSize = '1600px 1000px, auto';
})();
const tip = document.getElementById('tip');
let selected = null;
const FLY_MS = 1300; // keep in step with --fly in the CSS
let isClose = false;

const globe = Globe()(el)
  .backgroundColor('rgba(0,0,0,0)')
  .showGlobe(true)
  .showAtmosphere(true)
  .atmosphereColor('#aab2c2')
  .atmosphereAltitude(0.11)
  .showGraticules(false)
  .pointOfView({lat:12, lng:22, altitude:2.1});

/* Resolução de render. O globe.gl adota o devicePixelRatio da janela; com a
   página com zoom para fora ele cai abaixo de 1, a cena é desenhada menor que
   o CSS e ampliada, e o resultado é tudo pixelado. Piso em 1, teto em 2 para
   não estourar a GPU em telas retina grandes. */
/* Profundidade da câmera. O globe.gl entrega near=0.05 e far=125000, uma razão
   de 2,5 milhões para 1: com 24 bits de depth buffer sobra precisão quase nula
   perto da superfície, e os polígonos dos países passam a disputar profundidade
   com a esfera. É isso que se vê como chiado de TV, e é o que faz os nomes dos
   países entrarem e saírem do polígono. Ajustando os planos à distância real da
   câmera a razão cai para a casa das centenas e o conflito acaba. */
function fixDepth(){
  const cam = globe.camera();
  const d = cam.position.length();          // distância ao centro; o globo tem raio 100
  // O ponto mais próximo que precisa aparecer é a atmosfera, em raio ~111.
  const near = Math.max(0.5, (d - 130) * 0.6);
  const far = d + 260;                      // cobre o lado oposto do globo com folga
  if (Math.abs(cam.near - near) > 0.01 || Math.abs(cam.far - far) > 1){
    cam.near = near; cam.far = far;
    cam.updateProjectionMatrix();
  }
}

function fixPixelRatio(){
  const pr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  if (globe.renderer().getPixelRatio() !== pr) globe.renderer().setPixelRatio(pr);
}
fixPixelRatio();
addEventListener('resize', fixPixelRatio);
/* Conferido a cada frame, não por evento: o 'change' dos controls não dispara
   quando a câmera é movida por código, e o onZoom tampouco. Com os planos
   parados no valor da abertura, um zoom de aproximação chegava a cortar o
   globo inteiro. A checagem em si é só uma comparação de números. */
(function keepDepth(){ fixDepth(); requestAnimationFrame(keepDepth); })();

// Solid dark sea instead of a photo texture, so the map reads as UI.
const mat = globe.globeMaterial();
mat.color.set('#141821');
mat.emissive.set('#0f1219');
mat.emissiveIntensity = 0.35;
mat.shininess = 4;

// Countries: soft fill + thin stroke, plus small centred labels.
fetch('https://globe.gl/example/datasets/ne_110m_admin_0_countries.geojson')
  .then(r => r.json())
  .then(({features}) => {
    const countries = features.filter(f => f.properties.ISO_A2 !== 'AQ');
    globe
      .polygonsData(countries)
      .polygonCapColor(() => 'rgba(74,86,110,0.50)')
      .polygonSideColor(() => 'rgba(0,0,0,0)')
      .polygonStrokeColor(() => '#5b6784')
      .polygonAltitude(0.005)
      .polygonsTransitionDuration(0);

    // Nomes de país em tamanho FIXO. Mudar labelSize regenera a geometria de
    // texto de todos eles, e era isso que travava a cena a cada faixa de zoom;
    // o ganho de encolher o texto no zoom não paga esse custo.
    const labels = countries
      .filter(f => f.properties.POP_EST > 12e6 || ['CD','ZM','FI','BE','CH','KR'].includes(f.properties.ISO_A2))
      .map(f => ({name:f.properties.NAME, ...centroid(f), big:f.properties.POP_EST > 80e6}));
    globe
      .labelsData(labels)
      .labelLat(d => d.lat).labelLng(d => d.lng)
      .labelText(d => d.name)
      .labelSize(d => d.big ? 0.92 : 0.66)
      .labelsTransitionDuration(0)
      .labelDotRadius(0)
      .labelColor(() => 'rgba(205,210,222,0.46)')
      .labelAltitude(0.009)
      .labelResolution(4);
  });

function centroid(f){
  // Centre of the largest ring's bounding box; good enough for a label.
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  let best = null, bestArea = -1;
  polys.forEach(p => {
    const ring = p[0];
    let minX=180,maxX=-180,minY=90,maxY=-90;
    ring.forEach(([x,y]) => { minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y); });
    const area = (maxX-minX)*(maxY-minY);
    if (area > bestArea){ bestArea = area; best = {lat:(minY+maxY)/2, lng:(minX+maxX)/2}; }
  });
  return best;
}

// Chain links. Two passes per edge: a quiet continuous line that draws the
// route, and one small dot that glides along it. Dots start out of phase
// so the motion reads as a slow current rather than a pulse.
const arcData = [];
arcs.forEach(a => {
  arcData.push({...a, kind:'line'});
  arcData.push({...a, kind:'streak', phase: Math.random() * 2});
});

// Base lines render as screen-space 1px lines (stroke null): same thickness at
// every distance and never rebuilt. Only the dots are tubes, and their radius
// steps through a few zoom bands so the rebuild is rare.
const DOT_BANDS = [[0.15, 0.010], [0.3, 0.02], [0.6, 0.045], [1.2, 0.09], [Infinity, 0.16]];
let dotStroke = 0.16;
const dotStrokeFor = alt => DOT_BANDS.find(([max]) => alt < max)[1];
globe
  .arcsData(arcData)
  .arcColor(a => arcColor(a))
  .arcAltitudeAutoScale(0.32)
  .arcCurveResolution(64)
  .arcCircularResolution(6)
  .arcStroke(a => a.kind === 'line' ? null : dotStroke * (arcActive(a) ? 1.25 : 1))
  .arcDashLength(a => a.kind === 'line' ? 1 : 0.008)
  .arcDashGap(a => a.kind === 'line' ? 0 : 1.6)
  .arcDashInitialGap(a => a.kind === 'line' ? 0 : a.phase)
  .arcDashAnimateTime(a => a.kind === 'line' ? 0 : (arcActive(a) ? 5200 : 7600))
  .arcsTransitionDuration(0);

function arcActive(a){
  if (selected) return a.from === selected || a.to === selected;
  return a.focus;
}
function arcColor(a){
  const active = arcActive(a);
  if (a.kind === 'line'){
    if (selected) return active ? 'rgba(167,139,250,0.5)' : 'rgba(170,180,200,0.10)';
    return active ? 'rgba(167,139,250,0.4)' : 'rgba(180,190,210,0.28)';
  }
  // Dots: one light colour for every link, the route reads from the line.
  if (selected && !active) return 'rgba(0,0,0,0)';
  return 'rgba(236,240,250,1)';
}

// Participantes e nomes de país, ambos em DOM: ficam nítidos em qualquer zoom
// e nada precisa ser reconstruído quando a câmera se move.
globe
  .htmlElementsData(NODES)
  .htmlLat(d => d.lat).htmlLng(d => d.lng)
  .htmlAltitude(0.014)
  .htmlElement(d => {
    const m = document.createElement('div');
    // The LGES pin keeps the plain risk dot; the purple ring only marks its neighbours.
    m.className = 'marker' + (heroLinked.has(d.id) && !d.pinned ? ' focus' : '') + (d.pinned ? ' pinned' : '');
    const col = PHASE_COLOR(d);
    m.style.setProperty('--c', col);
    m.style.setProperty('--glow', rgba(col, .45));   // pronta, para não recalcular na pintura
    m.dataset.id = d.id;
    m.innerHTML = d.pinned ? `<i></i>${lgesCard(d)}` : `<i></i><span class="mlabel">${d.name}<small>${TIERS[d.tier]}</small></span>`;
    if (!d.pinned){ // the LGES card carries its own info, no tooltip on it
      m.addEventListener('mouseenter', e => showTip(d, e));
      m.addEventListener('mousemove', e => moveTip(e));
      m.addEventListener('mouseleave', hideTip);
    }
    // globe.gl listens for pointerup on its container and fires onGlobeClick,
    // which would close the card right after a real click opened it.
    ['pointerdown','pointerup','mousedown','mouseup'].forEach(ev => m.addEventListener(ev, e => e.stopPropagation()));
    m.addEventListener('click', e => {
      e.stopPropagation();
      if (d.pinned) openLges(); else select(d.id);
    });
    return m;
  });

// Opening the LGES card: shared by the click and the Enter key. Card growth
// and camera fly share one clock (see --fly in CSS). Deferred a tick because
// globe.gl cancels camera tweens when it finishes processing a real pointer
// click, so one started inside the click handler never plays. No selection
// dim here: the neighbours stay readable next to the open card.
function openLges(){
  const d = byId[HERO];
  const card = document.querySelector('.marker.pinned .gcard');
  if (!card || card.classList.contains('open')) return; // open card is inert, sea click closes it
  setTimeout(() => {
    card.classList.add('open');
    globe.pointOfView({lat:d.lat, lng:d.lng, altitude:0.28}, FLY_MS);
  }, 80);
}

// Keyboard, for walking through the sequence while recording:
// Enter opens the card and flies in, Enter again presses Flow, Esc resets.
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ select(null); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const card = document.querySelector('.marker.pinned .gcard');
  if (!card) return;
  if (!card.classList.contains('open')){ openLges(); return; }
  const btn = card.querySelector('.chain');
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 180);
});

globe.onGlobeClick(() => select(null));
// Cheap things happen on every zoom frame. Rebuilding label meshes and arc
// tubes is not cheap, so that waits until the camera settles: doing it mid
// tween is what made the fly-in stutter.
let settleTimer = null;
globe.onZoom(({altitude}) => {
  // Histerese nos dois limiares: parar a câmera exatamente em cima de um deles
  // fazia o estado oscilar a cada frame, e era isso que piscava.
  const spin = globe.controls().autoRotate;
  if (spin && altitude < 0.55) globe.controls().autoRotate = false;
  else if (!spin && altitude > 0.72) globe.controls().autoRotate = true;

  if (isClose && altitude > 0.52){ isClose = false; document.querySelector('.frame').classList.remove('close'); }
  else if (!isClose && altitude < 0.42){ isClose = true; document.querySelector('.frame').classList.add('close'); }

  /* O raio dos dots é geometria de tubo: reconstruir 300 delas faz a cena
     saltar, então isso só acontece quando a câmera realmente para. */
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    const next = dotStrokeFor(altitude);
    if (next !== dotStroke){
      dotStroke = next;
      globe.arcStroke(globe.arcStroke());
    }
  }, 350);
});

// Slow idle spin until the first interaction.
globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.12;
globe.controls().enableZoom = true;
globe.controls().minDistance = 104;
globe.controls().maxDistance = 520;

/* ------------------------------------------------------------------
   INTERACTION
------------------------------------------------------------------ */
function select(id){
  selected = id;
  if (!id) document.querySelectorAll('.gcard').forEach(c => c.classList.remove('open'));
  globe.arcsData(arcData); // re-evaluate colour/stroke accessors
  const linked = new Set();
  if (id) arcs.forEach(a => { if (a.from === id) linked.add(a.to); if (a.to === id) linked.add(a.from); });
  document.querySelectorAll('.marker').forEach(m => {
    const mid = m.dataset.id;
    m.classList.toggle('selected', mid === id);
    m.classList.toggle('dim', !!id && mid !== id && !linked.has(mid));
  });
  renderCard(id ? byId[id] : byId['lges-pack'], id ? linked : null);
}

const FACTORY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2 13.5V6.5l4 2.5V6.5l4 2.5V4.5l4 2.5v6.5H2z"/><path d="M2 13.5h12"/></svg>';
const COUNTRY = {US:'United States', CN:'China', KR:'South Korea', JP:'Japan', BE:'Belgium', FI:'Finland', CA:'Canada', BR:'Brazil', CH:'Switzerland', CD:'DR Congo', ZM:'Zambia'};

// Everything on the card comes from the graph, nothing typed by hand:
// links, chain depth, sister sites and the countries the route touches.
function chainFacts(id){
  const suppliers = EDGES.filter(e => e[0] === id).map(e => byId[e[1]]);
  const customers = EDGES.filter(e => e[1] === id).map(e => byId[e[0]]);
  // Depth: shortest hop count down to a mine site.
  let depth = 0, frontier = [id], seen = new Set([id]);
  while (frontier.length){
    if (frontier.some(n => byId[n].tier === 9)) break;
    depth++;
    frontier = frontier.flatMap(n => EDGES.filter(e => e[0] === n).map(e => e[1])).filter(n => !seen.has(n) && seen.add(n));
  }
  // Every participant reachable upstream, for the country list.
  const reach = new Set(); let q = [id];
  while (q.length){ const n = q.shift(); EDGES.filter(e => e[0] === n).forEach(e => { if (!reach.has(e[1])){ reach.add(e[1]); q.push(e[1]); } }); }
  const countries = [...new Set([...customers.map(n => n.cc), ...[...reach].map(n => byId[n].cc)])].filter(cc => cc !== byId[id].cc);
  const sisters = NODES.filter(n => n.full === byId[id].full && n.id !== id);
  return {suppliers, customers, depth, countries, reach:reach.size, sisters};
}

function lgesCard(d){
  const f = chainFacts(d.id);
  return `<div class="gcard">
    <div class="gc-mini glass">
      <img class="logo" src="lg.png" alt="">
      <div class="name">LG Energy Solution</div>
    </div>
    <div class="gc-full glass">
    <div class="head">
      <img class="logo" src="lg.png" alt="">
      <div><div class="name">LG Energy Solution</div><div class="city">${d.city}</div></div>
      <button class="chain" type="button">Flow</button>
    </div>
    <div class="body">
      <div><label>Supply chain position</label><div class="val"><span class="ico">${FACTORY}</span>${TIERS[d.tier]}</div></div>
      <div><label>Supply Chain Risk</label><div class="val"><span class="pill"><i></i>${RISK_LABEL[d.risk]}</span></div></div>
      <div><label>Country of origin</label><div class="val"><span class="flags">${FLAG(d.cc)}</span>${COUNTRY[d.cc]}</div></div>
      <div><label>Associated countries</label><div class="val flags">${f.countries.map(FLAG).join('')}</div></div>
      <div class="divider"></div>
      <div><label>Direct links</label><div class="val kv"><b>${f.suppliers.length + f.customers.length}</b><span>${f.suppliers.length} supplier · ${f.customers.length} customer</span></div></div>
      <div><label>Chain depth</label><div class="val kv"><b>${f.depth}</b><span>tiers to mine site</span></div></div>
      <div class="wide"><label>Also operates</label><div class="chips">${f.sisters.map(n => `<span class="chip"><b>${TIERS[n.tier]}</b><small>${n.city.split(',')[0]}</small></span>`).join('')}</div></div>
      <div class="foot"><span><i></i>Cobalt route · ${f.reach} participants upstream</span><span>${f.customers.map(n => n.name).join(', ')} downstream</span></div>
    </div>
    </div>
  </div>`;
}

function renderCard(){ /* participant card removed; selection lives in the markers */ }

function showTip(d, e){
  tip.innerHTML = `<div class="t-tier" style="color:${PHASE_COLOR(d)}">${TIERS[d.tier]}</div><div class="t-name">${d.name}</div><div class="t-meta">${d.full} · ${d.city}</div><div class="t-meta" style="color:${RISK_COLOR[d.risk]}">${RISK_LABEL[d.risk]} risk</div>`;
  tip.classList.add('on'); moveTip(e);
}
function moveTip(e){ tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; }
function hideTip(){ tip.classList.remove('on'); }

renderCard(byId['lges-pack'], null);

window.addEventListener('resize', () => globe.width(el.clientWidth).height(el.clientHeight));
</script>
</body>
</html>
