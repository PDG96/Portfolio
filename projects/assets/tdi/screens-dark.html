<!doctype html>
<html><head><meta charset="utf-8"><title>TDI · Supplier Assessment screens (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#0A0A0C;color:#9A9EAB;font:13px Inter,sans-serif;padding:24px}
  h2{color:#F1F1F4;font-size:14px;font-weight:500;margin:0 0 10px}
  section{margin-bottom:40px}
  .frame{border:1px solid #2A2B33;display:inline-block;line-height:0}
  button{font:inherit;color:#F1F1F4;background:#1B1B20;border:1px solid #2A2B33;border-radius:8px;padding:7px 12px;cursor:pointer;margin-right:8px}
  button:hover{background:#202026}
</style></head>
<body>
<div style="margin-bottom:20px">
  <button id="copy1">Copy SVG · Supplier Assessment</button>
  <button id="copy2">Copy SVG · Entry form</button>
  <span id="msg"></span>
</div>
<section><h2>TDI-dark-supplier-assessment.svg</h2><div class="frame" id="s1"></div></section>
<section><h2>TDI-dark-entry-form.svg</h2><div class="frame" id="s2"></div></section>
<script src="screens-dark.js"></script>
<script>
const a = TDIScreens.supplierAssessment(), b = TDIScreens.entryForm();
document.getElementById('s1').innerHTML = a;
document.getElementById('s2').innerHTML = b;
const msg = document.getElementById('msg');
const copy = svg => navigator.clipboard.writeText(svg).then(()=>{ msg.textContent = 'copied, paste in Figma with ⌘V'; setTimeout(()=>msg.textContent='', 2500); });
document.getElementById('copy1').onclick = () => copy(a);
document.getElementById('copy2').onclick = () => copy(b);
window.SVGS = {a, b};
</script>
</body></html>
