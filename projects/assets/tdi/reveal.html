<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDI · Traced or opaque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Mesmo componente de comparação do case do KOTA: o cursor atravessa o quadro
   e a divisória acompanha, sem precisar clicar. Toque arrasta (toque não tem
   hover) e as setas funcionam quando o quadro está focado. */
:root{
  --ground:#0B0C10; --surface:#16171C; --border:#2A2B33;
  --text:#F1F1F4; --muted:#9A9EAB; --faint:#6C7080;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:Inter,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;padding:40px 24px}
figure{margin:0;width:min(1200px,100%)}
.cap{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}

.reveal{position:relative;width:100%;aspect-ratio:2048/998;border-radius:14px;overflow:hidden;
  border:1px solid var(--border);user-select:none;touch-action:pan-y;cursor:ew-resize;background:var(--surface)}
.reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
.reveal .after-layer{position:absolute;inset:0;z-index:1}                    /* fica à direita */
.reveal .before-layer{position:absolute;inset:0;z-index:2;
  clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0)}                        /* fica à esquerda */

.rline{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:rgba(255,255,255,.85);
  z-index:3;transform:translateX(-1px);pointer-events:none;box-shadow:0 0 12px rgba(0,0,0,.45)}
.rhandle{position:absolute;top:50%;left:var(--pos,50%);z-index:4;width:48px;height:48px;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  background:rgba(18,19,24,.5);backdrop-filter:blur(16px) saturate(1.5) contrast(1.05);
  -webkit-backdrop-filter:blur(16px) saturate(1.5) contrast(1.05);
  border:1px solid rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .2s var(--ease)}
.reveal:hover .rhandle{transform:translate(-50%,-50%) scale(1.08)}
.rhandle svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rhandle .chL{margin-right:2px}
.reveal:focus-visible{outline:2px solid #7A5AF8;outline-offset:2px}
</style></head>
<body>

<figure>
  <div class="reveal" id="tdiReveal" role="slider" tabindex="0"
       aria-label="Compare the opaque chain and the traced one"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" style="--pos:50%">
    <div class="after-layer"><img src="reveal/clear.jpg?v=4" alt="The chain traced: every stage with risk, evidence and date"></div>
    <div class="before-layer"><img src="reveal/blurred.jpg?v=3" alt="The same chain without traceability: shapes, no facts"></div>
    <div class="rline"></div>
    <div class="rhandle">
      <svg class="chL" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>
  <figcaption class="cap">The same chain, with and without the record behind it. Drag to compare.</figcaption>
</figure>

<script>
(function () {
  const el = document.getElementById('tdiReveal');
  if (!el) return;
  let dragging = false;
  function setPos(clientX){
    const r = el.getBoundingClientRect();
    const pct = Math.min(100, Math.max(0, ((clientX - r.left) / r.width) * 100));
    el.style.setProperty('--pos', pct + '%');
    el.setAttribute('aria-valuenow', Math.round(pct));
  }
  el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || dragging) setPos(e.clientX); });
  el.addEventListener('pointerdown', e => { dragging = true; el.setPointerCapture(e.pointerId); setPos(e.clientX); });
  el.addEventListener('pointerup', () => { dragging = false; });
  el.addEventListener('pointercancel', () => { dragging = false; });
  el.addEventListener('keydown', e => {
    let cur = parseFloat(el.style.getPropertyValue('--pos')) || 50;
    if (e.key === 'ArrowLeft') cur = Math.max(0, cur - 5);
    else if (e.key === 'ArrowRight') cur = Math.min(100, cur + 5);
    else return;
    e.preventDefault();
    el.style.setProperty('--pos', cur + '%');
    el.setAttribute('aria-valuenow', Math.round(cur));
  });
})();
</script>
</body></html>
