<style>
/* ==========================================================================
   KOTA — Evaluation, the list between Home and a file.

   Registration and evaluation used to be two entries in the rail and one
   queue in practice: an operator is invited, registers, and becomes
   reviewable. They are one section here, and this page is the whole pipeline
   in one table — who can be reviewed now, and who is still filling the form.

   Only a file that is complete can be opened, so only one row on this page
   leads anywhere. The rest are listed, because knowing they exist and are
   stuck is the reason a desk looks at this screen at all.
   ========================================================================== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
     font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
     font-variant-numeric:tabular-nums}

:root{
  --rail:54px; --pad:24px; --gutter:24px; --radius:8px; --topbar:52px;
  --ground:#151617;
  --block:#1D1D1E;
  --line:#2B2C2D;
  --ink:#F6F6F6;
  --ink-2:#D3D4D4;
  --muted:#898B8D;
  --track:#404244;
  --accent:#E8723F;
  --good:#32D583; --good-2:#6CE9A6;
  --warn:#FDB022; --warn-2:#FEDF89;
  --bad:#F97066;  --bad-2:#F96666;
  --info:#85A5FF; --info-2:#ADC6FF;
}

.app{display:flex;width:100%;min-width:1440px;min-height:100svh;
     position:relative;padding-left:var(--rail)}
.btn-sm:hover,.nav:hover,/* The hover band is a panel, not a stripe: it carries its own padding and
   stops short of the card wall. The table is pulled out by the same amount the
   rows are padded in, so the columns do not move. */
.tbl{margin:0 -12px}
.thead,.tbody .tr{padding-left:12px;padding-right:12px}
.tbody .tr{border-radius:8px}
.tbody .tr:hover{transition-duration:0s}

/* ---- rail ---- */
.rail{width:var(--rail);flex:none;background:var(--ground);display:flex;
      flex-direction:column;align-items:center;gap:22px;padding:30px 0 22px;
      position:fixed;top:0;left:0;height:100vh;height:100svh;z-index:10;
      border-right:1px solid #202122}
.navgroup{display:flex;flex-direction:column;align-items:center;gap:6px}
.nav{position:relative;width:36px;height:36px;border-radius:9px;border:0;padding:0;
     background:transparent;color:#8C8E90;display:grid;place-items:center;cursor:pointer;
     transition:background .15s ease,color .15s ease}
.nav svg{width:20px;height:20px}
.nav:hover{background:#2E3033;color:var(--ink)}
.nav:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.nav:disabled{color:#252525;cursor:not-allowed}
.nav:disabled:hover{background:#202122;color:#7A7D80}
.nav.active{background:rgba(255,255,255,.08);color:var(--ink)}
.nav.active::before{content:"";position:absolute;left:-9px;top:8px;width:2px;height:20px;
  border-radius:0 2px 2px 0;background:var(--accent)}
.rail .spacer{margin-top:auto}
.rail .me{width:32px;height:32px;display:block}

.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
      padding:0 var(--pad) var(--pad)}

/* ---- header ---- */
.stickyhead{position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);
  transition:margin .2s ease,padding .2s ease,box-shadow .2s ease}
.stickyhead.is-stuck{margin:0 calc(var(--pad) * -1);padding:0 var(--pad);
  box-shadow:0 10px 20px rgba(10,11,11,.55)}
.topbar{height:var(--topbar);flex:none;display:flex;align-items:center;gap:8px;
        font-size:10px;color:var(--muted)}
.topbar a{color:inherit;text-decoration:none;border-radius:4px;padding:2px 4px;margin:0 -4px}
.topbar a:hover{color:var(--ink);background:#202122}
.topbar .sep{width:5px;height:5px;border-right:1.5px solid var(--muted);
             border-top:1.5px solid var(--muted);transform:rotate(45deg);opacity:.8}
/* ---- back ----
   The breadcrumb says where you are; this says how to leave. It goes to the
   parent screen rather than to browser history, so it lands in the same place
   whether you arrived by clicking through or by opening the URL cold. */
.topbar .back{display:grid;place-items:center;width:24px;height:24px;flex:none;
  margin:0 2px 0 -4px;padding:0;border-radius:6px;color:var(--muted);
  transition:background .15s ease,color .15s ease}
.topbar .back:hover{background:#26282A;color:var(--ink);transition-duration:0s}
.topbar .back:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.topbar .back svg{width:14px;height:14px}
.topbar .here{color:var(--ink)}
.ophead{display:flex;align-items:center;gap:16px;padding-bottom:16px}
.ophead .logo{width:48px;height:48px;flex:none}
.opname{font-size:22px;line-height:28px;font-weight:600;color:var(--ink)}
.opaddr{margin-top:4px;font-size:14px;line-height:20px;color:var(--muted)}

/* ---- grid ---- */
.canvas{padding-top:var(--gutter);display:grid;grid-template-columns:1fr;
        gap:var(--gutter);align-content:start}
.block{background:var(--block);border-radius:var(--radius);padding:var(--pad);
       display:flex;flex-direction:column;min-width:0}
.block .head{margin-bottom:20px;display:flex;align-items:flex-start;
             justify-content:space-between;gap:16px}
.block h2{font-size:20px;line-height:28px;font-weight:500;margin:0;color:var(--ink)}
.block .sub{margin-top:4px;font-size:15px;line-height:20px;color:var(--muted)}

/* ---- the counts ----
   Four numbers that answer, in order: can I work, what is waiting on someone
   else, how heavy is the queue, and how old is it. */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter)}
.kpi{background:var(--block);border-radius:var(--radius);padding:18px var(--pad)}
.kpi .eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .row{margin-top:10px;display:flex;align-items:baseline;gap:10px}
.kpi b{font-size:30px;line-height:34px;font-weight:700;color:var(--ink)}
.kpi .m{font-size:12px;color:var(--muted)}
.kpi--now b{color:var(--accent)}

/* ---- the queue ---- */
/* Columns are shares of the table, not of their own contents. With
   min-width:max-content on each wrapper, the header and the body were two
   grids sizing themselves against different text, so a long cell pushed its
   column wider than the label above it. minmax(0, fr) takes content out of
   the calculation entirely: every row resolves to the same track list because
   the only input is the table's width. */
.tbl{display:flex;flex-direction:column}
.thead,.tbody{min-width:0}
.tr{display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.2fr)
                          minmax(0,.7fr) minmax(0,.9fr) 86px;
    gap:var(--gutter);align-items:center}

.thead{padding-bottom:12px;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted)}
.tbody .tr{padding:14px 12px;border-bottom:1px solid var(--line);transition:background .15s ease}
.tbody .tr:last-child{border-bottom:0}
.tbody .tr--open{cursor:pointer}
.tbody .tr--open:hover{background:#242527}
.o-name{display:flex;align-items:center;gap:10px;font-size:17px;line-height:22px;color:var(--ink)}
.o-name .chip{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:#2B2C2D;color:var(--ink-2);font-size:10px;font-weight:700}
.tr--now .o-name .chip{background:var(--accent);color:#fff}
.o-sub{margin-top:2px;margin-left:36px;font-size:14px;line-height:18px;color:var(--muted)}
.cell{font-size:15px;color:var(--ink-2)}
.cell b{font-weight:600;color:var(--ink)}
.cell i{font-style:normal;color:var(--muted)}
.cell--off{color:#5E6062}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;
     border-radius:11px;background:var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.tag .dot{width:6px;height:6px;border-radius:50%}
.tag--now{color:#FF9C6E}     .tag--now .dot{background:#FF9C6E}
.tag--none{color:var(--muted)} .tag--none .dot{background:var(--muted)}

/* Registration progress, so a stuck operator is legible as stuck. */
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{width:120px;height:8px;border-radius:4px;background:var(--track);overflow:hidden;flex:none}
.prog .bar i{display:block;height:100%;border-radius:4px;background:#6A6D70}
.tr--now .prog .bar i{background:var(--fill,#F0F0F0)}
.prog .pct{font-size:14px;color:var(--muted)}

.tr > :last-child{justify-self:end}
.btn-sm{height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);
  background:#202122;color:var(--ink);font:inherit;font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:background .15s ease,border-color .15s ease}
.btn-sm:hover{background:#34363A;border-color:#4A4C50}
.btn-sm:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn-sm--now{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-sm--now:hover{background:#F2884F;border-color:#F2884F}
.btn-sm:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

.foot{margin-top:18px;font-size:13px;line-height:1.5;color:#5E6062}

.ctip{position:fixed;z-index:40;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  padding:6px 9px;border-radius:6px;background:var(--block);border:1px solid var(--line);
  box-shadow:0 6px 12px rgba(0,0,0,.35);font-size:12px;color:var(--ink);white-space:nowrap;
  transition:opacity .12s ease}
.ctip.is-on{opacity:1}
.ctip--right{transform:translate(0,-50%)}
.ctip .tip-off{margin-left:8px;padding:1px 6px;border-radius:9px;background:#2B2C2D;
  color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.04em}

/* ---- the seat switcher, at the foot of the rail ----
   The product has two sides and a visitor should be able to change sides from
   anywhere, without going back to the front door to do it. */
.rail .me{border:0;padding:0;background:none;cursor:pointer}
.seatpop{position:fixed;left:62px;bottom:20px;z-index:50;width:244px;padding:8px;
  border-radius:10px;background:var(--block);border:1px solid var(--line);
  box-shadow:0 16px 28px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);
  pointer-events:none;transition:opacity .16s ease,transform .16s ease}
.seatpop.is-on{opacity:1;transform:none;pointer-events:auto}
.seatpop .lbl{padding:8px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted)}
.seatpop button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;
  border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:14px;
  text-align:left;cursor:pointer}
.seatpop button:hover{background:#26282A}
.seatpop button .r{margin-left:auto;font-size:12px;color:var(--muted)}
.seatpop .sep{height:1px;margin:6px 4px;background:var(--line)}

/* Unread is a dot on the bell, not a number: the count is in the panel. */
.nav .badge{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 2px var(--ground)}
.notifpop{position:fixed;left:62px;bottom:64px;z-index:50;width:296px;padding:8px;border-radius:10px;
  background:var(--block);border:1px solid var(--line);box-shadow:0 16px 28px rgba(0,0,0,.5);
  opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease}
.notifpop.is-on{opacity:1;transform:none;pointer-events:auto}
.notifpop .lbl{padding:8px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notifpop button{width:100%;display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:0;
  border-radius:8px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.notifpop button:hover{background:#26282A}
.notifpop .dot{width:7px;height:7px;flex:none;margin-top:6px;border-radius:50%;background:var(--accent)}
.notifpop .old .dot{background:var(--track)}
.notifpop b{display:block;font-size:13px;line-height:18px;font-weight:500;color:var(--ink)}
.notifpop .m{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
</style>

  </div>
</div>

<div class="notifpop" id="notifpop" role="menu" aria-label="Notifications">
  <div class="lbl">Notifications</div>
  <button type="button" data-href="operator-detail.html" role="menuitem"><span class="dot"></span><span><b>Tulivu Cooperative is ready for your decision</b><span class="m">Today · Evaluation</span></span></button>
  <button type="button" data-href="operator-detail.html" role="menuitem"><span class="dot"></span><span><b>Tulivu Cooperative uploaded 2 documents</b><span class="m">Yesterday · Registration</span></span></button>
  <button type="button" data-href="evaluation.html" role="menuitem" class="old"><span class="dot"></span><span><b>Riverbend cooperative reached 72% of its registration</b><span class="m">3 days ago · Registration</span></span></button>
</div>

<div class="seatpop" id="seatpop" role="menu" aria-label="Change seat">
  <div class="lbl">You are viewing as</div>
  <button type="button" data-seat="bank" role="menuitem">Banque Orimu <span class="r">Bank · current</span></button>
  <button type="button" data-seat="operator" role="menuitem">Tulivu Cooperative <span class="r">Operator</span></button>
  <div class="sep"></div>
  <button type="button" data-seat="start" role="menuitem">Back to the front door</button>
</div>

<div class="ctip" id="ctip" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   One list, two states. An operator is either far enough along to be judged,
   or still filling the form — and the second group is listed without being
   openable, because a file that does not exist yet cannot be reviewed.
   ========================================================================== */
(function(){

  var DETAIL = 'operator-detail.html';

  var operators = [
    { name:'Tulivu Cooperative',             place:'Goma, North Kivu', initials:'TC',
      state:'Ready for review', progress:100, score:62, last:'12 Aug 2025', ready:true },
    { name:'Riverbend cooperative',     place:'North Kivu',       initials:'RC',
      state:'Registering',      progress:72,  last:'today' },
    { name:'Amani Bethem',              place:'South Kivu',       initials:'AB',
      state:'Registering',      progress:55,  last:'3 days ago' },
    { name:'Mweka village association', place:'Maniema',          initials:'MW',
      state:'Registering',      progress:25,  last:'2 weeks ago' },
    { name:'Matoro',                    place:'Maniema',          initials:'MT',
      state:'Invited',          progress:12,  last:'1 week ago' },
    { name:'Serandi Mining',                  place:'Goma, North Kivu', initials:'TX',
      state:'Registering',      progress:100, last:'2 days ago' }
  ];

  var ready = operators.filter(function(o){ return o.ready; });

  /* ---- the counts ---- */
  var kpis = [
    { k:'Ready for review', v:ready.length, m:'Waiting on this desk', now:true },
    { k:'Still registering', v:operators.filter(function(o){ return !o.ready; }).length,
      m:'Waiting on the operator' },
    { k:'Average registration', v:Math.round(operators.reduce(function(a,o){ return a+o.progress; },0)/operators.length) + '%',
      m:'Across the six files' },
    { k:'Oldest without movement', v:'2 w', m:'Mweka village association' }
  ];
  document.getElementById('kpis').innerHTML = kpis.map(function(x){
    return '<div class="kpi' + (x.now ? ' kpi--now' : '') + '">' +
      '<span class="eyebrow">' + x.k + '</span>' +
      '<div class="row"><b>' + x.v + '</b><span class="m">' + x.m + '</span></div></div>';
  }).join('');

  /* ---- the table ---- */
  var rows = document.getElementById('rows');
  operators.forEach(function(o){
    var tr = document.createElement('div');
    tr.className = 'tr' + (o.ready ? ' tr--now tr--open' : '');
    tr.innerHTML =
      '<div><div class="o-name"><span class="chip">' + o.initials + '</span>' + o.name + '</div>' +
        '<div class="o-sub">' + o.place + '</div></div>' +
      '<span><span class="tag tag--' + (o.ready ? 'now' : 'none') + '"><span class="dot"></span>' +
        o.state + '</span></span>' +
      '<div class="prog"><span class="bar"><i style="width:' + o.progress + '%"></i></span>' +
        '<span class="pct">' + o.progress + '%</span></div>' +
      (o.ready ? '<span class="cell"><b>' + o.score + '</b> <i>/ 100</i></span>'
               : '<span class="cell cell--off">Not scored</span>') +
      '<span class="cell' + (o.ready ? '' : ' cell--off') + '">' + o.last + '</span>' +
      (o.ready
        ? '<button class="btn-sm btn-sm--now" type="button">Review</button>'
        : '<button class="btn-sm" type="button" disabled ' +
          'title="Registration is not complete, so there is no file to open">Review</button>');
    if (o.ready) tr.addEventListener('click', function(){ KOTA.go(DETAIL); });
    rows.appendChild(tr);
  });

  document.getElementById('foot').textContent =
    'Five of the six are still with their operators. They appear here so the desk can see the ' +
    'whole pipeline, but a review only opens once a registration has been submitted.';

  /* ---- rail, header, tooltip: the same behaviour as the other screens ---- */
  document.getElementById('goHome').addEventListener('click', function(){
    KOTA.go('bank-home.html');
  });


  /* ---- the seat switcher ---- */
  var pop = document.getElementById('seatpop'), seatBtn = document.getElementById('seatBtn');
  if (pop && seatBtn){
    seatBtn.addEventListener('click', function(e){ e.stopPropagation(); pop.classList.toggle('is-on'); });
    document.addEventListener('click', function(e){
      if (!pop.contains(e.target)) pop.classList.remove('is-on');
    });
    [].forEach.call(pop.querySelectorAll('[data-seat]'), function(b){
      b.addEventListener('click', function(){
        var seat = b.getAttribute('data-seat');
        try { if (seat !== 'start') localStorage.setItem('kota-seat', seat); } catch (err) {}
        KOTA.go(seat === 'operator' ? 'operator-home.html'
                            : seat === 'start' ? 'start.html' : 'bank-home.html');
      });
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') pop.classList.remove('is-on');
    });
  }


  /* The bell holds the same events the feed does; it exists so they are
     reachable from the screens that do not carry the feed. */
  var bell = document.getElementById('bellBtn'), npop = document.getElementById('notifpop');
  if (bell && npop){
    bell.addEventListener('click', function(e){
      e.stopPropagation();
      npop.classList.toggle('is-on');
      var sp = document.getElementById('seatpop');
      if (sp) sp.classList.remove('is-on');
    });
    [].forEach.call(npop.querySelectorAll('[data-href]'), function(b){
      b.addEventListener('click', function(){ KOTA.go(b.getAttribute('data-href')); });
    });
    document.addEventListener('click', function(e){
      if (!npop.contains(e.target)) npop.classList.remove('is-on');
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') npop.classList.remove('is-on');
    });
  }

  var tip = document.getElementById('ctip');
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return;
    var r = el.getBoundingClientRect(), rail = el.closest('.rail');
    tip.innerHTML = el.getAttribute('data-tip') +
      (el.hasAttribute('data-tip-off') ? '<span class="tip-off">Disabled</span>' : '');
    tip.classList.toggle('ctip--right', !!rail);
    tip.style.left = rail ? (r.right + 10) + 'px' : (r.left + r.width / 2) + 'px';
    tip.style.top  = rail ? (r.top + r.height / 2) + 'px' : (r.top - 8) + 'px';
    tip.classList.add('is-on');
  });
  document.addEventListener('mouseout', function(e){
    if (e.target.closest && e.target.closest('[data-tip]')) tip.classList.remove('is-on');
  });

  function onScroll(){
    document.getElementById('stickyhead').classList.toggle('is-stuck', window.scrollY > 2);
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();

})();
</script>
<script src="motion.js?v=1"></script>
</body>
</html>
