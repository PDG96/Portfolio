<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Straatos Dashboard</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		padding: 0;
		height: 100%;
		width: 100%;
		font-family: -apple-system, BlinkMacSystemFont, "SF UI Display", "Segoe UI", Roboto, sans-serif;
		overflow: hidden;
	}

	.app-shell {
		display: flex;
		height: 100%;
		width: 100%;
	}

	/* ---------------- Sidebar ---------------- */
	.sidebar {
		width: 255px;
		flex-shrink: 0;
		height: 100%;
		overflow: hidden;
		background: #01393A;
	}
	/* The exported SVG's viewBox is 291 wide but its actual sidebar rect is
	   only 255 of that (the rest is drop-shadow bleed). Rendering at 291px
	   makes the rect land at exactly 255 CSS px; the sidebar clips the rest. */
	.sidebar svg {
		display: block;
		width: 291px;
		height: auto;
	}

	.main {
		flex: 1;
		display: flex;
		flex-direction: column;
		min-width: 0;
		height: 100%;
	}

	/* ---------------- Top bar ---------------- */
	.header {
		height: 66px;
		flex-shrink: 0;
		background: #002627;
		display: flex;
		align-items: center;
		justify-content: flex-end;
		padding: 0 24px;
		color: #fff;
	}
	.header-right {
		display: flex;
		align-items: center;
		gap: 20px;
	}
	.header-lang {
		display: flex;
		align-items: center;
		gap: 8px;
		font-size: 14px;
		font-weight: 500;
	}
	.header-avatar {
		width: 40px;
		height: 40px;
		border-radius: 50%;
		/* Deliberately off the app's own teal palette so the account logo
		   reads as its own identity, not more Straatos chrome. */
		background: #C2540C;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	/* ---------------- Page title ---------------- */
	.page-title {
		height: 80px;
		flex-shrink: 0;
		background: #fff;
		border-bottom: 1px solid #E5E7EB;
		display: flex;
		align-items: center;
		padding: 0 24px;
	}
	.page-title h1 {
		font-size: 22px;
		font-weight: 600;
		color: #384250;
		margin: 0;
	}

	/* ---------------- Content ---------------- */
	.content {
		flex: 1;
		min-height: 0;
		overflow-y: auto;
		background: #F9FAFB;
		padding: 24px;
		display: flex;
		flex-direction: column;
		gap: 24px;
	}

	.card {
		background: #fff;
		border: 1px solid #E5E7EB;
		border-radius: 8px;
		overflow: hidden;
		/* The content column is a flex container, so without this the cards
		   shrink to fit the viewport instead of keeping their real height
		   and letting the column scroll. */
		flex-shrink: 0;
	}
	.card-header {
		height: 70px;
		display: flex;
		align-items: center;
		padding: 0 24px;
		border-bottom: 1px solid #E5E7EB;
	}
	.card-header h2 {
		font-size: 16px;
		font-weight: 600;
		color: #384250;
		margin: 0;
	}

	/* ---------------- Metrics row ---------------- */
	.metrics {
		display: flex;
		padding: 20px 24px;
	}
	.metric {
		flex: 1;
		padding: 0 24px;
		border-right: 1px solid #E5E7EB;
		min-width: 0;
	}
	.metric:first-child { padding-left: 0; }
	.metric:last-child { padding-right: 0; border-right: none; }
	.metric .label {
		font-size: 13px;
		color: #6C737F;
		margin: 0 0 10px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.metric .value {
		font-size: 20px;
		font-weight: 600;
		color: #384250;
	}
	.metric .flags {
		display: flex;
		gap: 4px;
	}
	.metric .flags img {
		width: 24px;
		height: 24px;
		border-radius: 50%;
	}

	/* ---------------- Map card ---------------- */
	.map-body {
		position: relative;
		height: 684px;
	}
	#map {
		position: absolute;
		inset: 0;
	}
	.mapboxgl-ctrl-logo { display: none !important; }

	.map-fallback {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 10px;
		padding: 32px;
		text-align: center;
		background: #F9FAFB;
	}
	.map-fallback strong { font-size: 15px; color: #384250; }
	.map-fallback span { font-size: 13px; color: #6C737F; max-width: 460px; line-height: 1.6; }
	.map-fallback code {
		background: #fff;
		border: 1px solid #E5E7EB;
		border-radius: 4px;
		padding: 2px 6px;
		font-size: 12px;
		color: #384250;
	}

	.nav-strip {
		position: absolute;
		bottom: 24px;
		right: 24px;
		z-index: 5;
		width: 24px;
		background: #fff;
		border: 1px solid #E5E7EB;
		border-radius: 5px;
		display: flex;
		flex-direction: column;
		overflow: hidden;
		box-shadow: 0 2px 4px rgba(16, 24, 40, 0.06);
	}
	.nav-strip button {
		width: 24px;
		height: 22px;
		border: none;
		border-bottom: 1px solid #E5E7EB;
		background: #fff;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
		padding: 0;
	}
	.nav-strip button:last-child { border-bottom: none; }
	.nav-strip button:hover { background: #F9FAFB; }
	.nav-strip svg { width: 24px; height: 22px; stroke: #6C737F; }

	/* ---------------- Map tooltip ---------------- */
	.mapboxgl-popup-content {
		border-radius: 8px;
		padding: 0;
		box-shadow: 0 9px 14px rgba(16, 24, 40, 0.05), 0 3px 3px rgba(16, 24, 40, 0.12), 0 6px 8px rgba(16, 24, 40, 0.08);
		font-family: inherit;
		width: 260px;
		overflow: hidden;
	}
	.mapboxgl-popup-tip { border-top-color: #fff; border-bottom-color: #fff; }
	.tooltip-header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 14px 16px 12px;
	}
	.tooltip-title-group {
		display: flex;
		align-items: center;
		gap: 8px;
		min-width: 0;
	}
	.tooltip-title {
		font-size: 15px;
		font-weight: 600;
		color: #384250;
		margin: 0;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.tooltip-header-icons { display: flex; gap: 8px; flex-shrink: 0; }
	.tooltip-icon-btn {
		width: 20px;
		height: 20px;
		border-radius: 3.33px;
		border: 1px solid #E5E7EB;
		background: #fff;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
		padding: 0;
		outline: none;
	}
	.tooltip-icon-btn svg { width: 10px; height: 10px; stroke: #6C737F; }
	.tooltip-icon-btn:hover { background: #F9FAFB; }
	.tooltip-close {
		width: 20px;
		height: 20px;
		border: none;
		background: transparent;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
		padding: 0;
		outline: none;
	}
	.tooltip-close svg { width: 10px; height: 10px; stroke: #6C737F; }
	.tooltip-divider { height: 1px; background: #F3F4F6; margin: 0 14px; }
	.tooltip-body {
		padding: 10px 14px 14px;
		display: flex;
		flex-direction: column;
		gap: 4px;
	}
	.tooltip-row {
		display: flex;
		justify-content: space-between;
		align-items: center;
		font-size: 12px;
	}
	.tooltip-row .label { color: #6C737F; }
	.tooltip-row .value { color: #384250; font-weight: 500; }

	/* ---------------- Performance charts ---------------- */
	.charts-row {
		display: flex;
		gap: 24px;
		padding: 24px;
	}
	.chart-card {
		flex: 1;
		min-width: 0;
		background: #fff;
		border: 1px solid #E5E7EB;
		border-radius: 8px;
		overflow: hidden;
		/* A definite height so the component inside can resolve its own 100%.
		   Without it G2Plot falls back to a default box and the canvas comes
		   out 280 wide inside a 430 card. */
		height: 340px;
	}
	.chart-card > chart-card,
	.chart-card .chart-mount { width: 100%; height: 100%; }
	/* The last column used to run at flex 1.14, carried over from the mockup's
	   proportions. The SVGs are width:100%, so that 14% scaled the whole third
	   chart up -- bigger type, taller plot, less breathing room inside its own
	   card than the other two. Equal columns, equal charts. */
	/* Matched to the chart-card component the bentos use, so the two chart
	   systems on the page read as one: same title size and weight, same 24px
	   frame, same rule under the header. It was 16px/600 here against 12px/500
	   there, which is what made them look like different products. */
	.chart-card-header {
		height: 64px;
		display: flex;
		align-items: center;
		padding: 0 24px;
		border-bottom: 1px solid rgba(20, 20, 20, 0.10);
	}
	.chart-card-header h3 {
		font-size: 12px;
		font-weight: 500;
		letter-spacing: -0.005em;
		color: #141414;
		margin: 0;
	}
	/* The hand-rolled renderer's styles lived here — axis type, grid,
	   tooltip. All of that belongs to the shared component now. */
	.anim-armed .card {
		opacity: 0;
		transform: translateY(20px);
	}
	.anim-armed .card.is-in {
		opacity: 1;
		transform: none;
		transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
		            transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
	}
	/* Series wipe in left to right, the way a dashboard paints its charts. */
	.anim-armed .chart-wrap svg { clip-path: inset(0 100% 0 0); }
	.anim-armed .chart-wrap.is-in svg {
		clip-path: inset(0 0 0 0);
		transition: clip-path 1.1s cubic-bezier(0.22, 1, 0.36, 1);
	}
	@media (prefers-reduced-motion: reduce) {
		.anim-armed .card,
		.anim-armed .card.is-in { opacity: 1; transform: none; transition: none; }
		.anim-armed .chart-wrap svg { clip-path: none; }
	}

	/* ==================== PHONE ====================
	   A phone version of the app rather than the desktop one shrunk: the rail
	   and the two header rows step aside for an app bar and a bottom tab bar,
	   the cards run edge to edge, and the map takes a height a thumb can work
	   with. */
	.m-appbar, .m-tabbar { display: none; }

	@media (max-width: 700px) {
		.sidebar, .header, .page-title { display: none; }
		.app-shell { flex-direction: column; padding-top: 56px; padding-bottom: 60px; }
		.main { height: auto; }

		.m-appbar {
			display: flex; align-items: center; gap: 12px;
			position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 20;
			padding: 0 14px; background: #01393A; color: #fff;
		}
		.m-burger { display: flex; flex-direction: column; gap: 4px; background: none; border: 0; padding: 6px; cursor: pointer; }
		.m-burger span { display: block; width: 18px; height: 1.5px; background: #fff; border-radius: 1px; }
		.m-title { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
		.m-eyebrow { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.62); }
		.m-title strong { font-size: 15px; font-weight: 600; }
		.m-avatar { width: 28px; height: 28px; border-radius: 50%; background: #E8833A; margin-left: auto; flex: none; }

		.m-tabbar {
			display: grid; grid-template-columns: repeat(4, 1fr);
			position: fixed; left: 0; right: 0; bottom: 0; height: 60px; z-index: 20;
			background: #fff; border-top: 1px solid #E5E7EB;
		}
		.m-tab {
			display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
			background: none; border: 0; cursor: pointer; color: #9AA3AF; font-size: 10px; font-weight: 500;
		}
		.m-tab svg { width: 20px; height: 20px; }
		.m-tab.is-on { color: #01393A; }

		.content { padding: 14px; gap: 14px; }
		.card-header { height: 52px; padding: 0 14px; }
		.metrics { flex-wrap: wrap; }
		.metric { flex: 1 0 45%; padding: 12px 14px; border-right: none; }
		.map-body, #map { height: 300px; }
		.charts-row { flex-direction: column; padding: 14px; gap: 14px; }
		.chart-card { height: 240px; }
		.nav-strip { transform: scale(.85); transform-origin: top right; }
	}
</style>
</head>
<body>
	<!-- Mobile app chrome. The desktop rail is a single exported SVG, so the
	     phone version is authored here rather than reflowed: a compact app bar
	     with the project switcher, and a bottom tab bar for the sections that
	     matter on a phone. Both are hidden above 700px. -->
	<header class="m-appbar">
		<button class="m-burger" aria-label="Menu"><span></span><span></span><span></span></button>
		<div class="m-title">
			<span class="m-eyebrow">Project Developer</span>
			<strong>Terra Viva</strong>
		</div>
		<span class="m-avatar" aria-hidden="true"></span>
	</header>

<div class="app-shell">
	<div class="sidebar">

	function showProjectTerritory(project) {
		const sourceId = "territory-" + project.id;
		if (map.getSource(sourceId)) return;
		map.addSource(sourceId, {
			type: "geojson",
			data: { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: project.polygon } },
		});
		map.addLayer({ id: sourceId + "-fill", type: "fill", source: sourceId, paint: { "fill-color": "#1B989B", "fill-opacity": 0.25 } });
		map.addLayer({ id: sourceId + "-line", type: "line", source: sourceId, paint: { "line-color": "#1B989B", "line-width": 2 } });
	}

	function hideAllTerritories() {
		projects.forEach((p) => {
			const sourceId = "territory-" + p.id;
			if (map.getLayer(sourceId + "-fill")) map.removeLayer(sourceId + "-fill");
			if (map.getLayer(sourceId + "-line")) map.removeLayer(sourceId + "-line");
			if (map.getSource(sourceId)) map.removeSource(sourceId);
		});
	}

	// The dedicated project-dashboard page is a separate, much bigger build
	// that's on hold -- so this button stays inside the current page instead
	// of pointing at a page that doesn't exist yet. Clicking it flies in for
	// a closer look at the project's territory.
	function goToProjectDashboard(projectId) {
		const project = projects.find((p) => p.id === projectId);
		if (!project) return;
		markers.forEach((m) => m.getPopup().isOpen() && m.togglePopup());
		map.flyTo({ center: project.center, zoom: 13, pitch: 55, bearing: -20, duration: 1600 });

	function tooltipHtml(project) {
		return `
			<div class="tooltip-header">
				<div class="tooltip-title-group">
					<p class="tooltip-title">${project.name}</p>
				</div>
				<div class="tooltip-header-icons">

						</svg>
					</button>
					<button class="tooltip-close" title="Close" onclick="this.closest('.mapboxgl-popup').remove()">
						<svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M15 6.5L7 14.5M7 6.5L15 14.5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</button>
				</div>
			</div>
			<div class="tooltip-divider"></div>
			<div class="tooltip-body">
				<div class="tooltip-row"><span class="label">Location</span><span class="value">${project.location}</span></div>
				<div class="tooltip-row"><span class="label">Stratum</span><span class="value">${project.stratum}</span></div>
				<div class="tooltip-row"><span class="label">Area</span><span class="value">${project.hectares}</span></div>
			</div>
		`;
	}

	const markers = [];

	map.on("load", () => {
		// This style is built on Mapbox's Standard style (v3 "basemap"
		// import) -- labels aren't plain symbol layers you can loop over,
		// they're toggled through the import's config properties.
		map.setConfigProperty("basemap", "showPlaceLabels", false);
		map.setConfigProperty("basemap", "showRoadLabels", false);
		map.setConfigProperty("basemap", "showPointOfInterestLabels", false);
		map.setConfigProperty("basemap", "showTransitLabels", false);

		projects.forEach((project) => {

			el.className = "pin";
			el.innerHTML = '<img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjYiIHZpZXdCb3g9IjAgMCAyNCAyNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTUuNDU0NiA1LjU3NDUxQzguOTI3MiAyLjAyNTkxIDE0LjU1NjQgMi4wMjMzNCAxOC4wMjc2IDUuNTcwMzNDMjEuMzI4IDguOTQyODkgMjEuNDg4NiAxNC4zMDg0IDE4LjUxMTkgMTcuODc5SDE4LjUxMDVDMTguMzQ2MyAxOC4wODE2IDE4LjE3MzggMTguMjc4MyAxNy45OTE0IDE4LjQ2NjdMMTEuNzQ2NiAyNC44NDgyTDUuNjY0MjggMTguNjMyOEw1LjQ1MTE4IDE4LjQyMkMxLjk4MDI1IDE0Ljg3NDkgMS45ODIyNiA5LjEyMzE0IDUuNDU0NiA1LjU3NDUxWiIgZmlsbD0iIzFCOTg5QiIgc3Ryb2tlPSIjRTRGQ0ZEIiBzdHJva2Utd2lkdGg9IjEuMTkxNjgiLz4KPC9zdmc+Cg==" alt="" />';

			const popup = new mapboxgl.Popup({ offset: 20, closeButton: false }).setHTML(tooltipHtml(project));
			const marker = new mapboxgl.Marker({ element: el, anchor: "bottom" }).setLngLat(project.center).setPopup(popup).addTo(map);
			markers.push(marker);

			el.addEventListener("click", () => {
				hideAllTerritories();
				showProjectTerritory(project);
				map.flyTo({ center: project.center, zoom: 9, duration: 1400 });
			});
		});

		/* Entrance move for the case-study embed: the globe takes a slow turn,
		   then descends onto the Saloum Delta, the project the case study
		   follows end to end, and opens its card. Defined here because it
		   needs the map, the marker list and the territory layers in scope. */
		window.__dashIntro = () => {
			const hero = projects.find((p) => p.id === "saloum-delta") || projects[0];
			const idx = projects.indexOf(hero);
			// Linear easing on the turn: a spin should read as constant speed.
			map.easeTo({
				center: [WORLD_CENTER[0] + 58, WORLD_CENTER[1] + 7],
				duration: 2400,
				easing: (t) => t,
			});
			setTimeout(() => {
				map.flyTo({ center: hero.center, zoom: 7.2, pitch: 35, duration: 3000, curve: 1.4 });
			}, 2500);
			setTimeout(() => {
				showProjectTerritory(hero);
				const m = markers[idx];
				if (m && !m.getPopup().isOpen()) m.togglePopup();
			}, 5400);
		};
		// The choreography may have asked for it before the style finished.
		if (window.__dashIntroPending) {
			window.__dashIntroPending = false;
			window.__dashIntro();
		}
	});

	// Middle nav-strip icon (the "target" one) doubles as reset-to-world-view.
	document.getElementById("compassBtn").addEventListener("click", () => {
		hideAllTerritories();
		markers.forEach((m) => m.getPopup().isOpen() && m.togglePopup());
		map.flyTo({ center: WORLD_CENTER, zoom: WORLD_ZOOM, bearing: 0, pitch: 0, duration: 1400 });
	});
} catch (err) {
	console.error("Map failed to initialise:", err);
	const body = document.querySelector(".map-body");
	if (body) {
		body.innerHTML =
			'<div class="map-fallback">' +
			"<strong>O mapa precisa ser servido por http</strong>" +
			"<span>O Chrome bloqueia Web Workers em arquivos abertos direto (file://), e o Mapbox depende de um. " +
			"Rode <code>python3 -m http.server 8000</code> na pasta do arquivo e abra " +
			"<code>http://localhost:8000/dashboard.html</code>.</span>" +
			"</div>";
	}
}

<style>
	.pin {
		position: relative;
		width: 24px;
		height: 26px;
		cursor: pointer;
		/* No extra translateY here: the Marker is created with anchor:"bottom",
		   which already pins this element's bottom edge to the coordinate for
		   both flat and globe projections. A flat CSS offset on top of that
		   doesn't follow the sphere's curvature, so at low globe zoom the pins
		   visibly detach from the surface -- this was the "pins floating in
		   space" bug. */
	}
	.pin img {
		position: relative;
		z-index: 2;
		width: 100%;
		height: 100%;
		display: block;
		filter: drop-shadow(0 0 6px rgba(27, 152, 155, 0.85)) drop-shadow(0 2px 4px rgba(16, 24, 40, 0.35));
	}
	.pin:hover { transform: scale(1.08); transform-origin: bottom center; }
	/* Pulsing halo behind the pin's base (anchor point) for visibility at
	   far-out zoom levels, where the pin alone reads as a tiny speck. */
	.pin::before {
		content: "";
		position: absolute;
		left: 50%;
		bottom: 1px;
		width: 14px;
		height: 14px;
		margin-left: -7px;
		margin-bottom: -7px;
		border-radius: 50%;
		background: radial-gradient(circle, rgba(27, 152, 155, 0.55) 0%, rgba(27, 152, 155, 0) 70%);
		animation: pin-pulse 2.2s ease-out infinite;
		z-index: 1;
	}
	@keyframes pin-pulse {
		0% { transform: scale(1); opacity: 0.9; }
		70% { transform: scale(3.2); opacity: 0; }
		100% { transform: scale(3.2); opacity: 0; }
	}
</style>

<script>
	/* ==================== ENTRANCE CHOREOGRAPHY ====================
	   Fires once, when the case study reports the frame is on screen. The
	   point is that it reads as a live product and not a picture: the cards
	   settle in, the counters run up, the charts paint, the globe moves. */
	(() => {
		const embedded = window.self !== window.top;
		const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
		// Standalone or reduced-motion: leave everything at its resting state.
		if (!embedded || reduced) return;

		document.body.classList.add("anim-armed");

		// Stash each figure, zero it out, and count it back up on cue. The
		// flag row is a metric too but has no number, so it sits this out.
		const counters = [...document.querySelectorAll(".metric .value")]
			.filter((el) => !el.classList.contains("flags"))
			.map((el) => {
				el.dataset.target = el.textContent.trim();
				el.textContent = el.dataset.target.replace(/\d/g, "0");
				return el;
			});

		function runCounter(el) {
			const raw = el.dataset.target;
			const target = parseFloat(raw.replace(/,/g, ""));
			const grouped = raw.includes(",");
			const DUR = 1100;
			const t0 = performance.now();
			(function step(now) {
				const p = Math.min(1, (now - t0) / DUR);
				const v = Math.round(target * (1 - Math.pow(1 - p, 3)));
				el.textContent = grouped ? v.toLocaleString("en-US") : String(v);
				if (p < 1) requestAnimationFrame(step);
				else el.textContent = raw;
			})(t0);
			/* rAF is suspended while the tab is in the background, which would
			   otherwise leave the figure frozen at 0. Timers still fire, so
			   this lands the real number regardless of how the run went. */
			setTimeout(() => { el.textContent = raw; }, DUR + 250);
		}

		let revealed = false, flown = false;

		/* Split in two on purpose. The safety net below only reveals, so a
		   frame that never gets reported can't sit there blank; the globe
		   move is saved for an actual arrival, since spending it while the
		   reader is elsewhere means they never see it. */
		function reveal() {
			if (revealed) return;
			revealed = true;

			const cards = [...document.querySelectorAll(".card")];
			cards.forEach((c, i) => setTimeout(() => c.classList.add("is-in"), i * 160));

			// Numbers start once the first card has landed.
			setTimeout(() => counters.forEach(runCounter), 380);

			// Charts paint with the card that carries them.
			setTimeout(() => {
				document.querySelectorAll(".chart-wrap").forEach((w, i) =>
					setTimeout(() => w.classList.add("is-in"), i * 180)
				);
			}, cards.length * 160 + 120);

		}

		// Globe last, so the eye has somewhere to land after the cards.
		function play() {
			reveal();
			if (flown) return;
			flown = true;
			setTimeout(() => {
				if (window.__dashIntro) window.__dashIntro();
				else window.__dashIntroPending = true;
			}, 700);
		}

		addEventListener("message", (e) => {
			if (e.data && e.data.type === "bento:visible") play();
		});
