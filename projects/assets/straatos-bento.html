<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Straatos — Analysis bento</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF UI Display', 'Segoe UI', sans-serif;
  }

  /* The stage locks itself to the 1265/640 aspect ratio regardless of host
     (standalone or iframe). Width fills the viewport, height is derived. */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1265 / 640;
    height: auto;
    max-height: 100%;
  }

  .tile {
    position: absolute;
    overflow: hidden;
    border-radius: 12px;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
    will-change: transform, filter;
  }
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tile.species:hover {
    transform: translateY(-8px) scale(1.02);
    filter: drop-shadow(0 24px 48px rgba(15, 23, 42, 0.16));
    z-index: 5;
  }

  /* Desktop layout, bento is 1265 × 640 (aspect 1.977). All gaps uniform
     at 12 px:
       horizontal 12 px = 0.95% of 1265
       vertical   12 px = 1.875% of 640 (resolves to same pixels when the
                                         stage keeps its aspect-ratio). */
  .salinity     { left: 0;       top: 0;         width: 39.21%; height: 49.0625%; }
  .indicators   { left: 40.16%;  top: 0;         width: 25.30%; height: 49.0625%; }
  .awareness    { left: 66.41%;  top: 0;         width: 33.59%; height: 100%;     }
  .species      { left: 0;       top: 50.9375%;  width: 25.14%; height: 49.0625%; overflow: hidden; }
  .stakeholder  { left: 26.09%;  top: 50.9375%;  width: 39.37%; height: 49.0625%; }

  /* Below 900 px the bento abandons the absolute grid and stacks the tiles
     vertically. Each tile gets a min-height that keeps the charts inside
     readable, and the iframe's height stops being driven by an aspect
     ratio (the host page removes that constraint at the same breakpoint,
     see straatos.html). */
  @media (max-width: 900px) {
    .stage {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0;
      /* Drop the aspect-ratio so stacked tiles can grow to their min-heights */
      aspect-ratio: auto;
      height: auto;
    }
    .tile {
      position: static !important;
      left: auto !important;
      top: auto !important;
      width: 100% !important;
      height: auto !important;
    }
    .tile.salinity,
    .tile.stakeholder { min-height: 320px; }
    .tile.indicators  { min-height: 320px; }
    .tile.species     { min-height: 320px; }
    .tile.awareness   { min-height: 500px; }
  

    /* The indicator cards flex-fill a fixed-height tile on desktop. Stacked,
       the tile's height becomes auto, so flex-basis: 0 collapses each card to
       its padding (~38px) while the thumb stays pinned at 64px — the circles
       then overlapped each other and pushed out past the tile's top edge.
       Cards size to their content here, and the thumb comes down with them. */
    /* Same selector the desktop sizes are set on, or its 64px thumb wins on
       specificity and the custom property here never lands. */
    .tile.indicators > [data-chart="indicator-stack"] {
      --is-thumb-size: 44px;
      --is-value-size: 19px;
      --is-label-size: 13px;
      --is-gap: 12px;
      height: auto;
    }
    .tile.indicators > [data-chart="indicator-stack"] > .is-card {
      flex: 0 0 auto;
      min-height: 0;
    }
  }

  /* Live components fill their tile entirely. */
  .tile.salinity > chart-card,
  .tile.stakeholder > chart-card {
    width: 100%;
    height: 100%;
  }
  .tile.salinity .chart-mount,
  .tile.stakeholder .chart-mount {
    width: 100%;
    height: 100%;
  }

  /* Indicators tile, 3 internal cards with gap visually matching the bento
     grid gap (18.4px in mockup units → 5.40% of tile height). */
  .tile.indicators {
    display: flex;
    align-items: stretch;
  }
  .tile.indicators > [data-chart="indicator-stack"] {
    width: 100%;
    height: 100%;
    /* Internal card gap matches the 12px bento gap, expressed as % of the
       tile height (49.0625% of bento height = 314 px at native 640, so
       12 px ≈ 3.82%). */
    --is-gap: 3.82%;
    /* In the bento each card flex-fills the column, the content inside
       scales up to match so the cards do not feel half-empty. Value size
       kept moderate so long numbers (e.g. "129,421.12 ha") don't bleed
       under the delta chip. */
    --is-thumb-size: 64px;
    --is-card-padding-y: 18px;
    --is-card-padding-x: 18px;
    --is-label-size: 14px;
    --is-value-size: 22px;
  }

  /* Species composed card — video bg + donut overlay. The outer .tile
     handles the rounded corners + overflow clipping, this layer just
     hosts the video. */
  .species-inner {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .species-inner .bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .species-inner .vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.40) 100%);
    pointer-events: none;
  }
  .species-inner .donut {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 87.6%;
    aspect-ratio: 1109 / 767;
  }
  .species-inner .donut img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 1.2% 3% rgba(0, 0, 0, 0.32));
  }
</style>
</head>
<body>

<div class="stage">
  <div class="tile salinity">
    <chart-card title="Salinity levels">
      <div class="chart-mount" data-chart="smooth-line" data-src="/projects/assets/straatos-charts/salinity-levels.json"></div>
    </chart-card>
  </div>

  <div class="tile indicators">
    <div data-chart="indicator-stack" data-src="/projects/assets/straatos-charts/people-focused/people-focused.json"></div>
  </div>

  <div class="tile awareness">
    <img src="straatos-bento/Awareness Raising.png" alt="Awareness Raising">
  </div>

  <div class="tile species">
    <div class="species-inner">
      <video class="bg-video" autoplay muted loop playsinline preload="auto"
             src="straatos-bento/Species background.mp4"></video>
      <div class="vignette"></div>
      <div class="donut">
        <img src="straatos-bento/Species.png" alt="Species composition donut chart">
      </div>
    </div>
  </div>

  <div class="tile stakeholder">
    <chart-card title="Stakeholder Engagement">
      <div class="chart-mount" data-chart="stacked-area" data-src="/projects/assets/straatos-charts/stakeholder-engagement.json"></div>
    </chart-card>
  </div>
</div>

<script src="/components/chart-tooltip/chart-tooltip.js?v=4" defer></script>
<script src="/components/chart-card/chart-card.js?v=4" defer></script>
<script src="/components/smooth-line/smooth-line.js?v=4" defer></script>
<script src="/components/stacked-area/stacked-area.js?v=4" defer></script>
<script src="/components/indicator-stack/indicator-stack.js?v=4" defer></script>


</body>
</html>
