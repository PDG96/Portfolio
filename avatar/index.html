<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pietra, avatar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pietra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1b22;
    --ink-2: rgba(28, 27, 34, 0.62);
    --ink-3: rgba(28, 27, 34, 0.38);
    --glass: rgba(255, 255, 255, 0.42);
    --glass-strong: rgba(255, 255, 255, 0.66);
    --edge: rgba(255, 255, 255, 0.8);
    --edge-soft: rgba(255, 255, 255, 0.35);
    --shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 20px 50px -20px rgba(40, 30, 70, 0.28), 0 2px 8px -2px rgba(40, 30, 70, 0.10);
    --r: 22px;
    --pad: 18px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e1f0; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
  canvas { display: block; position: fixed; inset: 0; width: 100% !important; height: 100% !important; }   /* iOS: cobre a tela mesmo se o innerHeight atrasar */

  /* ---------- vidro ---------- */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(1.3);
    -webkit-backdrop-filter: blur(24px) saturate(1.3);
    border: 1px solid var(--edge-soft);
    border-top-color: var(--edge);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    transition: transform .5s var(--ease), box-shadow .5s var(--ease), background .3s;
  }
  .glass:hover { background: var(--glass-strong); }

  /* ---------- layout ---------- */
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .col { position: absolute; top: 24px; width: 280px; display: flex; flex-direction: column; gap: 14px; }
  .col.left { left: 24px; }
  .col.right { right: 24px; }

  /* ---------- cabeçalho ---------- */
  .head { padding: var(--pad) 20px; display: flex; align-items: center; gap: 12px; }
  .head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: .85; box-shadow: 0 0 0 4px rgba(28,27,34,.08); }
  .head .name { font-weight: 500; font-size: 15px; }
  .head .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .head .time { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: right; }
  .head .wx { font-size: 11px; margin-top: 2px; color: var(--ink-3); }

  /* ---------- estados ---------- */
  .states { padding: var(--pad) 20px 16px; }
  .states h2 { margin: 0 0 14px; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .state { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; padding: 10px 0; }
  .state + .state { border-top: 1px solid rgba(28,27,34,.06); }
  .state .label { font-size: 13px; font-weight: 500; }
  .state .value { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .state .track { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: rgba(28,27,34,.08); overflow: hidden; }
  .state .fill { height: 100%; width: 50%; border-radius: 4px; background: var(--ink); opacity: .78; transition: width .8s var(--ease), opacity .3s; }
  .state.low .fill { opacity: .32; }
  .state.low .label::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 8px; border-radius: 50%; background: var(--ink); vertical-align: middle; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: .9 } }

  /* ---------- alertas ---------- */
  .alerts { display: flex; flex-direction: column; gap: 10px; }
  .alert { padding: 16px 18px; display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; align-items: start;
           animation: rise .6s var(--ease) both; transform-style: preserve-3d; }
  .alert:hover { transform: translateY(-2px) perspective(800px) rotateX(1.5deg); }
  .alert.leaving { animation: fade .45s var(--ease) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98) } to { opacity: 1; transform: none } }
  @keyframes fade { to { opacity: 0; transform: translateX(18px) scale(.97) } }
  .alert .icon { width: 34px; height: 34px; border-radius: 12px; background: rgba(255,255,255,.7); display: grid; place-items: center; font-size: 16px;
                 box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 6px 14px -8px rgba(40,30,70,.35); }
  .alert .title { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
  .alert .body { font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }
  .alert .actions { grid-column: 2; margin-top: 10px; display: flex; gap: 8px; }
  .btn { appearance: none; border: 1px solid rgba(28,27,34,.1); background: rgba(255,255,255,.55); color: var(--ink); font: inherit; font-size: 12px; font-weight: 500;
         padding: 7px 12px; border-radius: 999px; cursor: pointer; transition: all .25s var(--ease); }
  .btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); transform: translateY(-1px); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-3); }
  .btn.ghost:hover { background: rgba(28,27,34,.06); color: var(--ink); transform: none; }
  .empty { padding: 18px 20px; font-size: 12.5px; color: var(--ink-3); text-align: center; }

  /* ---------- barra de ações ---------- */
  .dock { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 8px; display: flex; gap: 6px; border-radius: 999px; }
  .dock button { appearance: none; border: 0; background: transparent; width: 46px; height: 46px; border-radius: 999px; font-size: 19px; cursor: pointer;
                 display: grid; place-items: center; transition: all .3s var(--ease); position: relative; }
  .dock button:hover { background: rgba(255,255,255,.75); transform: translateY(-3px) scale(1.06); box-shadow: 0 10px 20px -10px rgba(40,30,70,.4); }
  .dock button:active { transform: translateY(0) scale(.96); }
  .dock button::after { content: attr(data-label); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(4px);
                        font-size: 11px; font-weight: 500; color: var(--ink); background: rgba(255,255,255,.85); padding: 5px 9px; border-radius: 999px;
                        white-space: nowrap; opacity: 0; pointer-events: none; transition: all .25s var(--ease); box-shadow: 0 6px 16px -8px rgba(40,30,70,.4); }
  .dock button:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }


  /* ---------- balão acima da cabeça ---------- */
  .bubble { position: absolute; transform: translate(-50%, -100%); padding: 8px 12px; border-radius: 14px; font-size: 13px; font-weight: 500;
            pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .bubble.show { opacity: 1; animation: float 1.8s var(--ease) forwards; }
  @keyframes float { 0% { margin-top: 6px; opacity: 0 } 15% { opacity: 1 } 80% { opacity: 1 } 100% { margin-top: -22px; opacity: 0 } }

  #err { position: fixed; left: 16px; bottom: 16px; color: #b33; font: 12px monospace; white-space: pre-wrap; }

  /* ---------- painel de preview (canto inferior direito) ---------- */
  .previewbtn { position: absolute; right: 24px; bottom: 26px; width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--edge-soft); cursor: pointer; font-size: 17px; display: grid; place-items: center; }
  .previewbtn:hover { background: var(--glass-strong); }
  .preview { position: absolute; right: 24px; bottom: 80px; width: min(600px, calc(100% - 48px)); padding: 14px 16px 12px; display: none; grid-template-columns: 74px 1fr; align-items: center; row-gap: 8px; column-gap: 10px; }
  .preview.open { display: grid; }
  .prow { display: contents; }
  .plabel { font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .preview .grp { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 16px; background: rgba(28,27,34,.05); justify-self: start; }
  .preview .grp button { appearance: none; border: 0; background: transparent; color: var(--ink-3); font: inherit; font-size: 11.5px; font-weight: 500; padding: 6px 10px; border-radius: 999px; cursor: pointer; transition: all .25s var(--ease); white-space: nowrap; }
  .preview .grp button:hover { color: var(--ink); }
  .preview .grp button.on { background: rgba(255,255,255,.85); color: var(--ink); box-shadow: 0 4px 12px -6px rgba(40,30,70,.4); }
  .preview .snd { appearance: none; border: 0; width: 36px; height: 30px; border-radius: 999px; background: rgba(28,27,34,.05); cursor: pointer; font-size: 14px; }

  /* ---------- botão de metas + painel ---------- */
  .iconbtn { appearance: none; border: 0; background: rgba(255,255,255,.55); width: 34px; height: 34px; border-radius: 999px; cursor: pointer; font-size: 15px; display: grid; place-items: center; transition: all .25s var(--ease); }
  .iconbtn:hover { background: #fff; transform: translateY(-1px); }
  .sheet { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(60,50,90,.18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 20; }
  .sheet.open { display: flex; }
  .panel { width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; padding: 22px 24px 20px; background: rgba(255,255,255,.78); }
  .panel h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .panel .hint { font-size: 12px; color: var(--ink-3); margin-bottom: 16px; line-height: 1.45; }
  .panel h3 { margin: 18px 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(28,27,34,.06); font-size: 13px; }
  .row:first-of-type { border-top: 0; }
  .row .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .row input[type=number], .row input[type=time] { width: 84px; font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(28,27,34,.12); background: rgba(255,255,255,.7); text-align: right; }
  .row input[type=time] { width: 92px; text-align: center; }
  .row .pair { display: flex; gap: 6px; align-items: center; }
  .switch { width: 36px; height: 22px; border-radius: 999px; background: rgba(28,27,34,.14); position: relative; cursor: pointer; transition: background .25s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--ink); } .switch.on::after { transform: translateX(14px); }
  .panel .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #000; }
  .btn.danger { color: #a33; }
  .photo { margin: 10px 0 4px; display: grid; gap: 10px; }
  .photo .drop { border: 1.5px dashed rgba(28,27,34,.2); border-radius: 16px; padding: 22px; text-align: center; font-size: 13px; color: var(--ink-2); cursor: pointer; background: rgba(255,255,255,.4); transition: all .25s; }
  .photo .drop:hover { background: rgba(255,255,255,.8); border-color: rgba(28,27,34,.4); }
  .photo img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px; display: block; }
  .photo input[type=file] { display: none; }
  .photo textarea { width: 100%; font: inherit; font-size: 13px; line-height: 1.45; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(28,27,34,.12); background: rgba(255,255,255,.7); resize: none; }
  .photo textarea:focus { outline: none; border-color: rgba(28,27,34,.4); }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(28,27,34,.06); margin-top: 12px; }
  .seg button { flex: 1; appearance: none; border: 0; background: transparent; color: var(--ink-3); font: inherit; font-size: 12.5px; font-weight: 500; padding: 8px 10px; border-radius: 999px; cursor: pointer; transition: all .25s var(--ease); }
  .seg button.on { background: rgba(255,255,255,.9); color: var(--ink); box-shadow: 0 4px 12px -6px rgba(40,30,70,.4); }
  .history .note { color: var(--ink-2); white-space: normal; }
  .kcal { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .kcal input { width: 90px; }
  .calib { font-size: 12px; color: var(--ink-3); }
  .history { max-height: 220px; overflow: auto; }
  .history .row { grid-template-columns: 44px 1fr auto; }
  .history img, .history .ph { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: rgba(28,27,34,.06); display: grid; place-items: center; font-size: 16px; }
  .dock button.meal { font-size: 17px; }
  .streak { font-size: 11px; color: var(--ink-3); }
  .cal { padding: 16px 18px 14px; }
  .cal .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .cal .top b { font-size: 13px; font-weight: 600; }
  .cal .top span { font-size: 11px; color: var(--ink-3); }
  .cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { font-size: 9.5px; text-align: center; color: var(--ink-3); letter-spacing: .08em; margin-bottom: 2px; }
  .cal .d { aspect-ratio: 1; display: grid; place-items: center; font-size: 11px; border-radius: 9px; color: var(--ink-3); position: relative; }
  .cal .d.in { color: var(--ink); background: rgba(255,255,255,.35); }
  .cal .d.done { background: var(--ink); color: #fff; opacity: .9; }
  .cal .d.streak { box-shadow: 0 0 0 2px rgba(28,27,34,.9), 0 6px 14px -6px rgba(40,30,70,.5); }
  .cal .d.part { background: rgba(28,27,34,.16); }
  .cal .d.today::after { content: ""; position: absolute; inset: -3px; border: 1.5px solid var(--ink); border-radius: 11px; }
  .cal .d.out { opacity: .35; }
  .cal .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 10px; }
  .cal .foot b { color: var(--ink); font-weight: 600; }
  .row input[type=date] { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(28,27,34,.12); background: rgba(255,255,255,.7); }

  /* ---------- faixa-resumo (só celular): toca pra abrir "Hoje" ---------- */
  .strip { display: none; padding: 10px 14px; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .strip b { color: var(--ink); font-weight: 600; }
  .strip .dots { margin-left: auto; display: flex; gap: 5px; }
  .strip .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: .18; }
  .strip .dots i.ok { opacity: .8; } .strip .dots i.mid { opacity: .45; }
  .strip .chev { color: var(--ink-3); font-size: 11px; }

  @media (max-width: 760px) {
    :root { --r: 18px; --pad: 12px; }
    .col.left { left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px); width: auto; gap: 8px; }
    .col.right { display: none; }
    .head { padding: 10px 14px; }
    .head .name { font-size: 14px; }
    .head .previewbtn { position: static; width: 34px; height: 34px; font-size: 15px; margin-left: 6px; box-shadow: none; background: rgba(255,255,255,.55); border: 0; }
    #tray { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 10px); display: flex; flex-direction: column; gap: 8px; }
    #tray .alerts { gap: 8px; }
    #tray .alert { padding: 12px 14px; grid-template-columns: 30px 1fr; }
    #tray .alert .icon { width: 30px; height: 30px; font-size: 14px; }
    #tray .alert .title { font-size: 13px; } #tray .alert .body { font-size: 11.5px; margin-top: 2px; }
    #tray .alert .actions { margin-top: 8px; }
    #tray .alert:hover { transform: none; }
    .empty { display: none; }
    .strip { display: flex; }
    .dock { position: static; transform: none; width: 100%; justify-content: space-between; padding: 6px; }
    .dock button { width: 42px; height: 42px; font-size: 18px; }
    .dock button:hover { transform: none; box-shadow: none; background: transparent; }
    .dock button::after { display: none; }
    .preview { left: 12px; right: 12px; width: auto; top: calc(env(safe-area-inset-top) + 70px); bottom: auto; grid-template-columns: 1fr; row-gap: 4px; }
    .preview .plabel { margin-top: 6px; }
    .sheet { align-items: flex-end; }
    .panel { width: 100%; max-height: calc(100% - env(safe-area-inset-top) - 40px); border-radius: 22px 22px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 16px); }
    .panel .states, .panel .cal { background: transparent; border: 0; box-shadow: none; padding-left: 0; padding-right: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .panel .states { display: block; padding-top: 4px; }
    .panel .states h2 { margin-bottom: 8px; }
    .panel .cal .d { font-size: 12px; }
    .row input[type=time] { width: 82px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.183.0/build/three.webgpu.js",
  "three/webgpu": "https://unpkg.com/three@0.183.0/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.183.0/build/three.tsl.js",
  "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div class="col left">
    <div class="glass head">
      <div class="dot"></div>
      <div><div class="name">Pietra</div><div class="sub" id="mood">calibrando</div></div>
      <div class="time"><div id="clock">00:00</div><div id="weather" class="wx"></div></div>
      <button class="iconbtn" id="openGoals" title="metas" style="margin-left:10px">⚙︎</button>
    </div>
    <div class="glass states" id="states">
      <h2>Agora</h2>
    </div>
    <div class="glass cal" id="cal"></div>
  </div>

  <div class="col right">
    <div class="alerts" id="alerts"></div>
  </div>

  <div class="glass strip" id="strip"><span id="stripText">Sem meta ativa</span><span class="dots" id="stripDots"></span><span class="chev">▲</span></div>
  <div class="glass dock" id="dock">
    <button data-act="meal" data-label="Registrar refeição">🍽️</button>
    <button data-act="water" data-label="Bebi água (+250 ml)">💧</button>
    <button data-act="exercise" data-label="Exercício">🏋️</button>
    <button data-act="walk" data-label="Caminhada">🚶</button>
    <button data-act="sleep" data-label="Registrar sono">🌙</button>
    <button data-act="history" data-label="Histórico">🗂️</button>
  </div>

  <button class="glass previewbtn" id="previewBtn" title="preview de estados">🎛</button>
  <div class="glass preview" id="preview">
    <div class="prow" id="env"><span class="plabel">Hora</span>
      <div class="grp" data-key="phase"><button data-v="auto" class="on">Auto</button><button data-v="dawn">Manhã</button><button data-v="day">Dia</button><button data-v="dusk">Pôr do sol</button><button data-v="night">Noite</button></div>
      <span class="plabel">Clima</span>
      <div class="grp" data-key="weather"><button data-v="auto" class="on">Auto</button><button data-v="clear">Sol</button><button data-v="clouds">Nuvem</button><button data-v="rain">Chuva</button></div>
    </div>
    <div class="prow" id="env2"><span class="plabel">Saúde</span>
      <div class="grp" data-key="health"><button data-v="auto" class="on">Auto</button><button data-v="radiant">Radiante</button><button data-v="healthy">Saudável</button><button data-v="tired">Cansada</button><button data-v="sick">Doente</button><button data-v="grave">Grave</button><button data-v="dead">Morta</button><button data-v="success">Sucesso</button></div>
      <span class="plabel">Evento</span>
      <div class="grp" data-key="event"><button data-ev="done">Ação ok</button><button data-ev="skip">Adiada</button><button data-ev="missed">Perdida</button><button data-ev="daylost">Dia perdido</button><button data-ev="daylostrun">Dias perdidos</button><button data-ev="daydone">Dia completo</button><button data-ev="daystreak">Sequência</button></div>
    </div>
    <div class="prow"><span class="plabel">Som</span><button id="sound" class="snd" title="som">🔇</button></div>
  </div>

  <div class="glass bubble" id="bubble"></div>

  <!-- painel de metas -->
  <div class="sheet" id="goalsSheet">
    <div class="glass panel" id="goalsPanel"></div>
  </div>
  <!-- hoje (celular): estados + calendário -->
  <div class="sheet" id="todaySheet">
    <div class="glass panel" id="todayPanel"><h2>Hoje</h2><div id="todayBody"></div><div class="foot"><button class="btn ghost" data-close>Fechar</button></div></div>
  </div>
  <!-- registro (check-in) -->
  <div class="sheet" id="checkSheet">
    <div class="glass panel" id="checkPanel"></div>
  </div>
</div>
<div id="err"></div>

<script type="module">
import { createScene } from './scene.js';
import { createAudio } from './audio.js';
import { loadGoals, saveGoals, loadCheckins, checkin, removeCheckin, loadPhoto, vitals, pending, estimateCalories,

  checkPanel.innerHTML = `<h2>Histórico</h2><div class="hint">Últimos registros. Apagar remove também a foto.</div><div class="history" id="hist"></div>
    <div class="foot"><button class="btn ghost" data-close>Fechar</button></div>`;
  const hist = checkPanel.querySelector('#hist');
  for (const c of list) {
    const row = document.createElement('div'); row.className = 'row';
    const when = new Date(c.at).toLocaleString('pt-BR', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    const extra = c.kcal ? `${c.kcal} kcal` : c.amount ? (c.type === 'water' ? `${c.amount} L` : c.type === 'sleep' ? `${c.amount} h` : `${c.amount} min`) : '';
    const esc = t => String(t).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
    row.innerHTML = `<div class="ph">${ICON[c.type] || '•'}</div><div>${TYPE_LABEL[c.type] || c.type}<div class="sub">${when} ${extra ? '· ' + extra : ''}</div>${c.note ? `<div class="sub note">${esc(c.note)}</div>` : ''}</div><button class="btn ghost danger">apagar</button>`;
    if (c.photo) { const b = await loadPhoto(c.id); if (b) { const img = document.createElement('img'); img.src = URL.createObjectURL(b); row.replaceChild(img, row.firstChild); } }
    row.querySelector('button').onclick = () => { removeCheckin(c.id); checkins = loadCheckins(); row.remove(); tick(); pushSync(); };
    hist.appendChild(row);
  }
  if (!list.length) hist.innerHTML = '<div class="hint">Nada registrado ainda.</div>';
  checkPanel.querySelector('[data-close]').onclick = () => checkSheet.classList.remove('open');
  checkSheet.classList.add('open');
}

// ---------------------------------------------------------------- dock
document.getElementById('dock').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'history') return openHistory();
  if (!goals.started || goals.dead) { renderGoals(); goalsSheet.classList.add('open'); return; }
  openCheckin(act);
});

// ---------------------------------------------------------------- balão
const bubbleEl = document.getElementById('bubble');
function bubble(text) { bubbleEl.textContent = text; bubbleEl.classList.remove('show'); void bubbleEl.offsetWidth; bubbleEl.classList.add('show'); }
function placeBubble() { const p = scene.headScreen(); bubbleEl.style.left = p.x + 'px'; bubbleEl.style.top = (p.y - 8) + 'px'; requestAnimationFrame(placeBubble); }
placeBubble();

// ---------------------------------------------------------------- clima + hora do dia → céu
const WEATHER_CODES = { 0: 'céu limpo', 1: 'quase limpo', 2: 'parcialmente nublado', 3: 'nublado', 45: 'neblina', 48: 'neblina',
  51: 'garoa', 53: 'garoa', 55: 'garoa', 61: 'chuva fraca', 63: 'chuva', 65: 'chuva forte', 71: 'neve', 80: 'pancadas', 81: 'pancadas', 82: 'pancadas fortes', 95: 'trovoada' };
let wx = { sunrise: null, sunset: null, clouds: 0, rain: 0, temp: null, code: 0, label: 'sem dados' };
async function fetchWeather() {
  const pos = await new Promise(res => { if (!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p => res(p.coords), () => res(null), { timeout: 4000 }); });
  const lat = pos?.latitude ?? -27.59, lon = pos?.longitude ?? -48.55;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,cloud_cover,precipitation,is_day&daily=sunrise,sunset&timezone=auto`;
    const d = await (await fetch(u)).json(); const c = d.current;
    wx.temp = Math.round(c.temperature_2m); wx.code = c.weather_code; wx.clouds = (c.cloud_cover ?? 0) / 100;
    wx.rain = Math.min(1, (c.precipitation ?? 0) / 2.5) || ([51,53,55,61,63,65,80,81,82,95].includes(c.weather_code) ? 0.5 : 0);
    wx.sunrise = new Date(d.daily.sunrise[0]); wx.sunset = new Date(d.daily.sunset[0]); wx.label = WEATHER_CODES[c.weather_code] || 'tempo';
  } catch (e) { wx.label = 'sem clima'; }
  const force = q.get('weather');
  if (force === 'rain') { wx.rain = 0.8; wx.clouds = 0.9; } if (force === 'clouds') { wx.rain = 0; wx.clouds = 0.9; } if (force === 'clear') { wx.rain = 0; wx.clouds = 0; }
  applyEnv();
}
function phaseWeights(now) {
  const day0 = new Date(now); day0.setHours(0, 0, 0, 0); const mins = (now - day0) / 60000;
  const sr = wx.sunrise ? (wx.sunrise - day0) / 60000 : 390, ss = wx.sunset ? (wx.sunset - day0) / 60000 : 1110;
  const bell = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
  const dawn = bell(mins, sr + 10, 45), dusk = bell(mins, ss - 10, 50);
  const day = mins > sr + 40 && mins < ss - 40 ? 1 : 0, night = mins < sr - 40 || mins > ss + 40 ? 1 : 0;
  const total = dawn + dusk + day + night || 1;
  return { dawn: dawn / total, dusk: dusk / total, day: day / total, night: night / total };
}
const override = { phase: 'auto', weather: 'auto', face: 'auto', health: 'auto' };   // só da sessão
const envEl = document.getElementById('env');
const previewEl = document.getElementById('preview');
document.getElementById('previewBtn').onclick = () => previewEl.classList.toggle('open');
function paintEnv() { document.querySelectorAll('#env .grp, #env2 .grp').forEach(g => { const k = g.dataset.key; g.querySelectorAll('button').forEach(b => { if (b.dataset.v) b.classList.toggle('on', b.dataset.v === override[k]); }); }); }
envEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !b.closest('.grp')) return; override[b.closest('.grp').dataset.key] = b.dataset.v; paintEnv(); applyEnv(); applyFace(); });
// editor de estado: saúde forçada (preview, não grava) e eventos disparados na hora
const HEALTH_PRESET = { radiant: 0.95, healthy: 0.8, tired: 0.58, sick: 0.35, grave: 0.12 };
document.getElementById('env2').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ev) {
    const ev = b.dataset.ev;
    if (ev === 'done') celebrate('lunch');
    else if (ev === 'skip') { scene.react('frustrated', { bounce: false }); bubble('tá bom…'); }
    else EVENT_REACTION[ev]({ type: 'lunch', run: 3, preview: true });
    return;
  }
  const key = b.closest('.grp').dataset.key;
  if (key === 'land') { override.land = b.dataset.v; paintEnv(); scene.setLandscape(override.land); return; }
  override.health = b.dataset.v; paintEnv();
  if (override.health === 'dead') { die(false); return; }
  if (document.body.dataset.dead && !goals.dead) { delete document.body.dataset.dead; scene.revive(); }
  if (override.health === 'success') { gs = { ...(gs || {}), success: true }; scene.setBaseClip('cheer'); }
  tick();
});
paintEnv();
function applyEnv() {
  const now = new Date();
  if (q.get('hour')) { const [h, m] = q.get('hour').split(':'); now.setHours(+h, +(m || 0), 0, 0); }
  let weights = phaseWeights(now);
  if (override.phase !== 'auto') weights = { dawn: 0, day: 0, dusk: 0, night: 0, [override.phase]: 1 };
  let clouds = wx.clouds, rain = wx.rain;
  if (override.weather === 'clear') { clouds = 0; rain = 0; } if (override.weather === 'clouds') { clouds = 0.9; rain = 0; } if (override.weather === 'rain') { clouds = 0.9; rain = 0.8; }
  scene.setEnvironment({ weights, clouds, rain }); audio.setRain(rain);
  const sub = document.getElementById('weather'); if (sub) sub.textContent = (wx.temp != null ? `${wx.temp}°  ·  ` : '') + wx.label;
}
fetchWeather(); setInterval(applyEnv, 60000); setInterval(fetchWeather, 15 * 60000);

// ---------------------------------------------------------------- relógio + ciclo (tempo real: recalcula a cada 30 s)
const clockEl = document.getElementById('clock');
setInterval(() => { clockEl.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }, 1000);
// ---------------------------------------------------------------- celular: cabeçalho + bandeja embaixo, estados/calendário viram a folha "Hoje"
const MOBILE = matchMedia('(max-width: 760px)').matches;
const todaySheet = document.getElementById('todaySheet');
if (MOBILE) {
  const tray = document.createElement('div'); tray.id = 'tray';
  tray.append(document.getElementById('alerts'), document.getElementById('strip'), document.getElementById('dock'));
  document.getElementById('ui').appendChild(tray);
  document.getElementById('todayBody').append(document.getElementById('states'), document.getElementById('cal'));
  document.querySelector('.head').appendChild(document.getElementById('previewBtn'));
  document.getElementById('strip').onclick = () => { if (!goals.started) { renderGoals(); goalsSheet.classList.add('open'); } else todaySheet.classList.add('open'); };
  todaySheet.querySelector('[data-close]').onclick = () => todaySheet.classList.remove('open');
}
function renderStrip(info, stk) {
  const t = document.getElementById('stripText'), d = document.getElementById('stripDots');
  if (!info) { t.innerHTML = 'Sem meta ativa · <b>definir</b>'; d.innerHTML = ''; return; }
  t.innerHTML = info.active ? `dia <b>${info.dayN}</b> de ${info.total} · faltam <b>${info.left}</b> · <b>${stk}</b> ${stk === 1 ? 'seguido' : 'seguidos'}` : (Date.now() < info.start ? 'começa em breve' : 'período encerrado');
  const vv = v ? [v.hidratacao, v.energia, v.saciedade, v.movimento] : [];
  d.innerHTML = vv.map(x => `<i class="${x > 60 ? 'ok' : x > 30 ? 'mid' : ''}"></i>`).join('');
}
// ---------------------------------------------------------------- calendário do período
const calEl = document.getElementById('cal');
function renderCal() {
  const info = periodInfo(goals);
  if (!info) { calEl.innerHTML = ''; calEl.style.display = 'none'; renderStrip(null, 0); return; }
  calEl.style.display = '';
  const now = Date.now(), today = dayKey(now);
  const view = new Date(now); view.setDate(1); view.setHours(0, 0, 0, 0);
  const monthName = view.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const first = (view.getDay() + 6) % 7;                              // segunda = 0
  const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  const stk = streak(goals, checkins);
  // dias que fazem parte da sequência atual (contando de trás pra frente a partir de hoje/ontem)
  const streakDays = new Set();
  { let d = fromKey(today); if (!dayStatus(goals, checkins, d).complete) d -= 864e5; for (let i = 0; i < stk; i++) { streakDays.add(dayKey(d)); d -= 864e5; } }
  let cells = ['S','T','Q','Q','S','S','D'].map(x => `<div class="dow">${x}</div>`).join('');
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ts = new Date(view.getFullYear(), view.getMonth(), d).getTime(), k = dayKey(ts);
    const inPeriod = ts >= info.start && ts <= info.end;
    const st = inPeriod && ts <= now ? dayStatus(goals, checkins, ts) : null;
    const cls = ['d', inPeriod ? 'in' : 'out', k === today ? 'today' : '', st?.complete ? 'done' : (st?.any ? 'part' : ''), streakDays.has(k) ? 'streak' : ''].join(' ');
    cells += `<div class="${cls}" title="${st ? st.done + '/' + st.items : ''}">${d}</div>`;
  }
  calEl.innerHTML = `<div class="top"><b>${monthName[0].toUpperCase() + monthName.slice(1)}</b><span>${info.active ? `dia ${info.dayN} de ${info.total}` : (now < info.start ? 'começa em breve' : 'período encerrado')}</span></div>
    <div class="grid">${cells}</div>
    <div class="foot"><span>faltam <b>${info.left}</b> dias</span><span>${gs ? `<b>${gs.lost}</b> perdidos · ` : ''}<b>${stk}</b> ${stk === 1 ? 'seguido' : 'seguidos'}</span></div>`;
  renderStrip(info, stk);
}

// ---------------------------------------------------------------- eventos → reações (uma vez cada)
const CELEBRATIONS = ['cheer', 'clap', 'laugh', 'jump', 'greet_02'];
let celebIdx = 0;
const EVENT_REACTION = {
  missed:     e => { scene.react('depressed', { bounce: false }); bubble('perdi o ' + (MEAL_LABEL[e.type] || '').toLowerCase() + '…'); },
  daylost:    e => { scene.react('defeat_02', { bounce: false }); bubble('ontem não deu…'); },
  daylostrun: e => { scene.react('defeat_03', { bounce: false }); bubble(e.run + ' dias perdidos…'); },
  daydone:    e => { scene.react('clap'); bubble('dia completo ✨'); },
  daystreak:  e => { scene.react('laugh'); bubble(e.run + ' dias seguidos!'); },
  success:    e => { scene.setBaseClip('cheer'); bubble('meta cumprida 🎉'); },
  dead:       e => { die(!e.preview); },
};
function die(persist = true) {
  if (persist) { goals.dead = true; saveGoals(goals); }
  document.body.dataset.dead = '1';
  scene.hold('fall'); scene.setHealth(0);
  document.getElementById('mood').textContent = 'não resistiu';
  for (const k of [...open.keys()]) closeAlert(k);
  renderEmpty('Metade dos dias da meta foi perdida. Ela não resistiu. Recomeçar em ⚙︎.');
}
function processEvents() {
  gs = goalStatus(goals, checkins);
  for (const e of newEvents(goals, checkins)) { const fn = EVENT_REACTION[e.kind]; if (fn) fn(e); }
  if (gs && gs.dead && !document.body.dataset.dead) { document.body.dataset.dead = '1'; die(); }
}

function tick() { gs = goalStatus(goals, checkins); if (override.health === 'success') gs = { ...(gs || {}), success: true }; renderStates(); renderAlerts(); renderCal(); processEvents(); applyFace(); }
setInterval(tick, 30000);
tick();
if (!goals.started) setTimeout(() => { renderGoals(); goalsSheet.classList.add('open'); }, 1500);
if (q.get('open')) setTimeout(() => openCheckin(q.get('open')), 800);   // vindo da notificação: já abre o registro
if (q.get('event')) setTimeout(() => { const fn = EVENT_REACTION[q.get('event')]; if (fn) fn({ type: 'lunch', run: 3, preview: true }); }, 3000);   // preview: ?event=dead (não grava)
swReady().catch(() => {});
// atualização: quando um service worker novo assume, recarrega uma vez (senão o app instalado no iPhone fica na versão velha)
if ('serviceWorker' in navigator) {
  let reloading = false; const hadController = !!navigator.serviceWorker.controller;   // na 1ª visita o SW só assume, sem recarregar
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading || !hadController) return; reloading = true; location.reload(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && swReg) swReg.update().catch(() => {}); });   // ao voltar pro app, procura versão nova
}
if (pushState.on) pushSync();                                        // ao abrir, o Worker recebe o retrato do dia
</script>
